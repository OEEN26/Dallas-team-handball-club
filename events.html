<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Events</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar,.wrap{max-width:1100px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{color:#19c957}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.wrap{padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.danger{border-color:#6b2929;color:#ff9d9d}.muted{color:#999;font-size:12px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.widget .value{font-size:34px;font-weight:900}.event-list{display:grid;gap:12px}.event-card{overflow:hidden;padding:0}.event-img{width:100%;max-height:360px;object-fit:cover;display:block;background:#222}.event-body{padding:15px;display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:start}.datebox{text-align:center;background:#102718;border:1px solid #285d38;border-radius:12px;padding:10px}.datebox b{font-size:26px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.field textarea{min-height:85px}.section{margin-top:18px}.admin-only{display:none}.empty{padding:18px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}.upload-note{margin-top:5px}@media(max-width:800px){.grid2,.widget-grid{grid-template-columns:1fr}.event-body{grid-template-columns:68px 1fr}.event-body .actions{grid-column:1/-1}.bar{align-items:flex-start}}</style></head><body><header><div class="bar"><div class="brand"><img src="./Dallas-thc-logo.png.JPG" class="logo" alt="Dallas THC"><div>Dallas <span>THC</span><div class="muted">EVENTS</div></div></div><div class="top-actions"><a class="btn" id="backBtn" href="./player-dashboard.html">Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading events…</div><div id="app" style="display:none"><section><h2>Event Hub</h2><div class="muted">Practices, tournaments, club events, photos and tournament readiness.</div><div id="widgets" class="widget-grid section"></div></section><section class="admin-only section" id="adminPanel"><div class="card"><h3>Create Event</h3><div class="grid2"><div class="field"><label>Event Name</label><input id="evTitle"></div><div class="field"><label>Event Type</label><select id="evType"><option>Practice</option><option>Tournament</option><option>Scrimmage</option><option>Meeting</option><option>Fundraiser</option><option>Social</option><option>Event</option></select></div><div class="field"><label>Team</label><select id="evTeam"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Date</label><input id="evDate" type="date"></div><div class="field"><label>Start Time</label><input id="evStart" type="time"></div><div class="field"><label>End Time</label><input id="evEnd" type="time"></div></div><div class="field" style="margin-top:10px"><label>Location</label><input id="evLocation"></div><div class="field" style="margin-top:10px"><label>Event Picture</label><input id="evImage" type="file" accept="image/*"><div class="muted upload-note">Add a tournament poster, event flyer, team image or other event picture. Max 10 MB.</div></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="evNotes"></textarea></div><div class="actions"><button class="btn primary" id="saveEvent">Create Event</button><a class="btn" href="./event-readiness.html">Tournament Readiness</a></div><div id="eventMsg" class="muted"></div></div></section><section class="section"><h2>Upcoming Events</h2><div id="events" class="event-list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session,role='player',team='All',events=[];function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();role=prof?.role||'player';if(role==='player'){const {data:me}=await sb.from('player_directory_public').select('team').eq('user_id',session.user.id).maybeSingle();team=me?.team||'All'}else{$('backBtn').href='./';$('backBtn').textContent='Admin Dashboard';document.querySelectorAll('.admin-only').forEach(x=>x.style.display='block')}await refresh();$('loading').style.display='none';$('app').style.display='block'}async function refresh(){const today=new Date().toISOString().slice(0,10);const [{data:e,error},{data:p}]=await Promise.all([sb.from('club_events').select('*').gte('event_date',today).order('event_date').order('start_time'),sb.from('practices').select('*').gte('practice_date',today).order('practice_date').order('start_time')]);if(error){$('loading').textContent=error.message;return}events=(e||[]).filter(x=>x.team==='All'||team==='All'||x.team===team);const pr=(p||[]).filter(x=>x.team==='All'||team==='All'||x.team===team);$('widgets').innerHTML='<div class="card widget"><div class="muted">UPCOMING EVENTS</div><div class="value">'+events.length+'</div></div><div class="card widget"><div class="muted">NEXT EVENT</div><h3>'+(events[0]?esc(events[0].title):'TBA')+'</h3><div class="muted">'+(events[0]?fmtDate(events[0].event_date):'No event scheduled')+'</div></div><div class="card widget"><div class="muted">NEXT PRACTICE</div><h3>'+(pr[0]?esc(pr[0].title):'TBA')+'</h3><div class="muted">'+(pr[0]?fmtDate(pr[0].practice_date):'No practice scheduled')+'</div></div>';renderEvents()}function renderEvents(){$('events').innerHTML=events.length?events.map(e=>'<div class="card event-card">'+(e.image_url?'<img class="event-img" src="'+esc(e.image_url)+'" alt="'+esc(e.title)+'">':'')+'<div class="event-body"><div class="datebox"><div class="muted">'+new Date(e.event_date+'T00:00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase()+'</div><b>'+new Date(e.event_date+'T00:00:00').getDate()+'</b></div><div><b>'+esc(e.title)+'</b><div class="muted" style="margin-top:5px">'+esc(e.event_type)+' • '+esc(e.team)+(e.start_time?' • '+e.start_time.slice(0,5):'')+(e.location?' • '+esc(e.location):'')+'</div>'+(e.notes?'<div style="margin-top:7px">'+esc(e.notes)+'</div>':'')+'</div>'+(role!=='player'?'<div class="actions"><a class="btn primary" href="./event-readiness.html?event='+encodeURIComponent(e.id)+'">Readiness List</a><button class="btn danger" onclick="deleteEvent(\''+e.id+'\')">Delete</button></div>':'')+'</div></div>').join(''):'<div class="empty">No upcoming events yet.</div>'}async function uploadImage(file){if(!file)return null;if(file.size>10485760)throw new Error('Image must be 10 MB or smaller.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();const path=session.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await sb.storage.from('event-media').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return sb.storage.from('event-media').getPublicUrl(path).data.publicUrl}$('saveEvent').onclick=async()=>{const title=$('evTitle').value.trim(),date=$('evDate').value;if(!title||!date){$('eventMsg').textContent='Event name and date are required.';return}$('saveEvent').disabled=true;$('eventMsg').textContent='Creating event…';try{const image_url=await uploadImage($('evImage').files[0]);const payload={title,event_type:$('evType').value,team:$('evTeam').value,event_date:date,start_time:$('evStart').value||null,end_time:$('evEnd').value||null,location:$('evLocation').value.trim()||null,notes:$('evNotes').value.trim()||null,image_url,created_by:session.user.id};const {error}=await sb.from('club_events').insert(payload);if(error)throw error;$('eventMsg').textContent='Event created.';['evTitle','evDate','evStart','evEnd','evLocation','evNotes','evImage'].forEach(id=>$(id).value='');await refresh()}catch(e){$('eventMsg').textContent=e.message||'Could not create event.'}finally{$('saveEvent').disabled=false}};async function deleteEvent(id){if(!confirm('Delete this event?'))return;const {error}=await sb.from('club_events').delete().eq('id',id);if(error)alert(error.message);else refresh()}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
