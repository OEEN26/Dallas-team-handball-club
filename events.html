<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Events</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{color:#19c957}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.danger{border-color:#6b2929;color:#ff9d9d}.muted{color:#999;font-size:12px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.widget{min-height:140px;display:flex;flex-direction:column;justify-content:space-between}.widget .value{font-size:34px;font-weight:900}.countdown{color:#55d97b}.event-list{display:grid;gap:10px}.event-card{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.datebox{text-align:center;background:#102718;border:1px solid #285d38;border-radius:12px;padding:10px}.datebox b{font-size:26px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.field textarea{min-height:85px;resize:vertical}.section{margin-top:18px}.admin-only{display:none}.widget-choice{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #292929;border-radius:10px;padding:11px;margin-top:8px}.empty{padding:18px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}@media(max-width:800px){.grid2,.widget-grid{grid-template-columns:1fr}.event-card{grid-template-columns:72px 1fr}.event-card .actions{grid-column:1/-1}.bar{align-items:flex-start}.top-actions{justify-content:flex-end}}</style></head><body><header><div class="bar"><div class="brand"><img src="./Dallas-thc-logo.png.JPG" class="logo" alt="Dallas THC"><div>Dallas <span>THC</span><div class="muted">EVENTS</div></div></div><div class="top-actions"><a class="btn" id="backBtn" href="./player-dashboard.html">Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading events…</div><div id="app" style="display:none"><section><h2>Event Hub</h2><div class="muted">Practices, tournaments, club events, and dashboard widgets.</div><div id="widgets" class="widget-grid section"></div></section><section class="admin-only section" id="adminPanel"><div class="grid2"><div class="card"><h3>Create Event</h3><div class="grid2"><div class="field"><label>Event Name</label><input id="evTitle"></div><div class="field"><label>Event Type</label><select id="evType"><option>Practice</option><option>Tournament</option><option>Scrimmage</option><option>Meeting</option><option>Fundraiser</option><option>Social</option><option>Event</option></select></div><div class="field"><label>Team</label><select id="evTeam"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Date</label><input id="evDate" type="date"></div><div class="field"><label>Start Time</label><input id="evStart" type="time"></div><div class="field"><label>End Time</label><input id="evEnd" type="time"></div></div><div class="field" style="margin-top:10px"><label>Location</label><input id="evLocation"></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="evNotes"></textarea></div><div class="actions"><button class="btn primary" id="saveEvent">Create Event</button></div><div id="eventMsg" class="muted"></div></div><div class="card"><h3>Customize Player Widgets</h3><div class="muted">Turn widgets on or off. Changes appear for players automatically.</div><div id="widgetSettings"></div><div class="actions"><button class="btn" data-addwidget="next_event_countdown">+ Next Event Countdown</button><button class="btn" data-addwidget="upcoming_events">+ Upcoming Events</button><button class="btn" data-addwidget="next_practice_countdown">+ Next Practice</button></div></div></div></section><section class="section"><h2>Upcoming Events</h2><div id="events" class="event-list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoiZWRmc2h0anJ4YnR5ZG9hZ2hoaXAiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NzcwNTQ2MiwiZXhwIjoyMTAzMjgxNDI2fQ.WQL24YgZ2uUu-telRRNk2477FFWAbL9GIzyA5hdnq8k');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session,role='player',team='All',events=[],widgets=[];function dt(date,time){return new Date(date+'T'+(time||'23:59')+':00')}function remaining(target){let d=target-new Date();if(d<=0)return'Now';let days=Math.floor(d/86400000);let hrs=Math.floor((d%86400000)/3600000);let mins=Math.floor((d%3600000)/60000);return(days?days+'d ':'')+hrs+'h '+mins+'m'}function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();role=prof?.role||'player';if(role==='player'){const {data:me}=await sb.from('player_directory_public').select('team').eq('user_id',session.user.id).maybeSingle();team=me?.team||'All'}else{$('backBtn').href='./';$('backBtn').textContent='Admin Dashboard';document.querySelectorAll('.admin-only').forEach(x=>x.style.display='block')}await refresh();$('loading').style.display='none';$('app').style.display='block';setInterval(renderWidgets,30000)}async function refresh(){const today=new Date().toISOString().slice(0,10);const [{data:e,error:ee},{data:w,error:we},{data:p}]=await Promise.all([sb.from('club_events').select('*').gte('event_date',today).order('event_date').order('start_time'),sb.from('dashboard_widgets').select('*').eq('enabled',true).order('sort_order'),sb.from('practices').select('*').gte('practice_date',today).order('practice_date').order('start_time')]);if(ee||we){$('loading').textContent=(ee||we).message;return}events=(e||[]).filter(x=>x.team==='All'||team==='All'||x.team===team);widgets=(w||[]).filter(x=>x.audience==='All'||team==='All'||x.audience===team);window._practices=(p||[]).filter(x=>x.team==='All'||team==='All'||x.team===team);renderWidgets();renderEvents();if(role!=='player')renderWidgetSettings()}function renderWidgets(){let html='';for(const w of widgets){if(w.widget_type==='next_practice_countdown'){const p=(window._practices||[])[0];html+=p?'<div class="card widget"><div><div class="muted">'+esc(w.title||'Next Practice')+'</div><h3>'+esc(p.title)+'</h3><div class="muted">'+fmtDate(p.practice_date)+(p.start_time?' • '+p.start_time.slice(0,5):'')+'</div></div><div class="value countdown">'+remaining(dt(p.practice_date,p.start_time))+'</div></div>':'<div class="card widget"><div class="muted">Next Practice</div><div class="value">TBA</div></div>'}if(w.widget_type==='next_event_countdown'){const e=events[0];html+=e?'<div class="card widget"><div><div class="muted">'+esc(w.title||'Next Event')+'</div><h3>'+esc(e.title)+'</h3><div class="muted">'+fmtDate(e.event_date)+(e.start_time?' • '+e.start_time.slice(0,5):'')+'</div></div><div class="value countdown">'+remaining(dt(e.event_date,e.start_time))+'</div></div>':'<div class="card widget"><div class="muted">Next Event</div><div class="value">TBA</div></div>'}if(w.widget_type==='upcoming_events'){html+='<div class="card widget"><div class="muted">'+esc(w.title||'Upcoming Events')+'</div><div class="value">'+events.length+'</div><div class="muted">scheduled</div></div>'}}$('widgets').innerHTML=html||'<div class="empty">No widgets enabled yet.</div>'}function renderEvents(){$('events').innerHTML=events.length?events.map(e=>'<div class="card event-card"><div class="datebox"><div class="muted">'+new Date(e.event_date+'T00:00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase()+'</div><b>'+new Date(e.event_date+'T00:00:00').getDate()+'</b></div><div><b>'+esc(e.title)+'</b><div class="muted" style="margin-top:5px">'+esc(e.event_type)+' • '+esc(e.team)+(e.start_time?' • '+e.start_time.slice(0,5):'')+(e.location?' • '+esc(e.location):'')+'</div>'+(e.notes?'<div style="margin-top:7px">'+esc(e.notes)+'</div>':'')+'</div>'+(role!=='player'?'<div class="actions"><button class="btn danger" onclick="deleteEvent(\''+e.id+'\')">Delete</button></div>':'')+'</div>').join(''):'<div class="empty">No upcoming events yet.</div>'}function renderWidgetSettings(){sb.from('dashboard_widgets').select('*').order('sort_order').then(({data})=>{$('widgetSettings').innerHTML=(data||[]).map(w=>'<div class="widget-choice"><div><b>'+esc(w.title||w.widget_type)+'</b><div class="muted">'+esc(w.widget_type)+'</div></div><button class="btn '+(w.enabled?'primary':'')+'" onclick="toggleWidget(\''+w.id+'\','+(!w.enabled)+')">'+(w.enabled?'On':'Off')+'</button></div>').join('')})}$('saveEvent').onclick=async()=>{const title=$('evTitle').value.trim(),date=$('evDate').value;if(!title||!date){$('eventMsg').textContent='Event name and date are required.';return}const payload={title,event_type:$('evType').value,team:$('evTeam').value,event_date:date,start_time:$('evStart').value||null,end_time:$('evEnd').value||null,location:$('evLocation').value.trim()||null,notes:$('evNotes').value.trim()||null,created_by:session.user.id};const {error}=await sb.from('club_events').insert(payload);$('eventMsg').textContent=error?.message||'Event created.';if(!error){['evTitle','evDate','evStart','evEnd','evLocation','evNotes'].forEach(id=>$(id).value='');await refresh()}};async function deleteEvent(id){if(!confirm('Delete this event?'))return;const {error}=await sb.from('club_events').delete().eq('id',id);if(error)alert(error.message);else refresh()}async function toggleWidget(id,enabled){const {error}=await sb.from('dashboard_widgets').update({enabled}).eq('id',id);if(error)alert(error.message);else refresh()}document.querySelectorAll('[data-addwidget]').forEach(b=>b.onclick=async()=>{const type=b.dataset.addwidget;const titles={next_event_countdown:'Next Event',upcoming_events:'Upcoming Events',next_practice_countdown:'Next Practice'};const {error}=await sb.from('dashboard_widgets').insert({widget_type:type,title:titles[type],audience:'All',enabled:true,sort_order:20,created_by:session.user.id});if(error)alert(error.message);else refresh()});$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
