<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19c957"><title>Dallas THC Event Attendance</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 70px}header{background:#111;border-bottom:1px solid #292929;padding:12px 14px}.bar{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900}.brand span{color:#19c957}.muted{color:#999;font-size:12px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:9px 11px;border-radius:9px;text-decoration:none;cursor:pointer}.primary,.selected{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.card,.row{background:#151515;border:1px solid #292929;border-radius:12px;padding:13px}.field label{display:block;color:#999;font-size:11px;margin-bottom:5px}.field select{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.actions,.buttons{display:flex;gap:6px;flex-wrap:wrap}.list{display:grid;gap:8px;margin-top:14px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}@media(max-width:650px){.row{grid-template-columns:1fr}.bar{align-items:flex-start}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">EVENT ATTENDANCE</div></div><div class="actions"><a class="btn primary" href="./admin-operations.html">Club Operations</a><a class="btn" href="./index.html">Dashboard</a></div></div></header><main class="wrap"><div id="loading" class="card">Loading…</div><div id="app" style="display:none"><div class="card"><div class="field"><label>Event</label><select id="event"></select></div><div class="field" style="margin-top:10px"><label>Team Filter</label><select id="team"><option>All</option><option>Men</option><option>Women</option></select></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="load">Load Roster</button><button class="btn" id="all">Mark All Present</button></div></div><div id="roster" class="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session,players=[];async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!p||!['admin','manager'].includes(p.role)){location.href='./player-dashboard.html';return}const [{data:e},{data:pl}]=await Promise.all([sb.from('club_events').select('*').order('event_date',{ascending:false}).limit(50),sb.from('players').select('id,name,team,status,jersey_number').order('name')]);players=pl||[];$('event').innerHTML=(e||[]).map(x=>'<option value="'+x.id+'">'+esc(x.event_date)+' — '+esc(x.title)+' ('+esc(x.team)+')</option>').join('');$('loading').style.display='none';$('app').style.display='block';loadRoster()}async function loadRoster(){const event_id=$('event').value,team=$('team').value;if(!event_id)return;const {data:a}=await sb.from('attendance_records').select('*').eq('event_id',event_id);const map=new Map((a||[]).map(x=>[x.player_id,x.status]));const r=players.filter(x=>x.status==='Active'&&(team==='All'||x.team===team));$('roster').innerHTML=r.map(p=>'<div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.team)+(p.jersey_number?' • #'+p.jersey_number:'')+'</div></div><div class="buttons">'+['Present','Absent','Excused'].map(s=>'<button class="btn '+(map.get(p.id)===s?'selected':'')+'" onclick="mark(\''+p.id+'\',\''+s+'\',this)">'+s+'</button>').join('')+'</div></div>').join('')}window.mark=async(player_id,status,btn)=>{const event_id=$('event').value;const {error}=await sb.from('attendance_records').upsert({event_id,player_id,status,marked_by:session.user.id,marked_at:new Date().toISOString()},{onConflict:'event_id,player_id'});if(error)return alert(error.message);btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected')};$('load').onclick=loadRoster;$('all').onclick=async()=>{const event_id=$('event').value,team=$('team').value;for(const p of players.filter(x=>x.status==='Active'&&(team==='All'||x.team===team))){await sb.from('attendance_records').upsert({event_id,player_id:p.id,status:'Present',marked_by:session.user.id,marked_at:new Date().toISOString()},{onConflict:'event_id,player_id'})}loadRoster()};$('event').onchange=loadRoster;boot();</script><script defer src="./header.js"></script></body></html>
