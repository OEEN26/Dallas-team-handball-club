st"></div></div></div></section><section id="tournaments" class="panel"><div class="grid2"><div class="card"><h3>Create Tournament</h3><div class="field"><label>Name</label><input id="tTitle"></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Start</label><input id="tStart" type="date"></div><div class="field"><label>End</label><input id="tEnd" type="date"></div><div class="field"><label>Location</label><input id="tLocation"></div><div class="field"><label>Status</label><select id="tStatus"><option>Planning</option><option>Open</option><option>Locked</option><option>Completed</option></select></div></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="tNotes"></textarea></div><div class="actions"><button class="btn primary" id="createTournament">Create Tournament</button></div><div id="tMsg" class="muted"></div></div><div><h3>Tournaments</h3><div id="tournamentList" class="list"></div><div id="tournamentAttendees" class="card" style="margin-top:12px" hidden aria-live="polite"></div></div></div><div class="card" style="margin-top:12px"><h3>Tournament Roster Manager</h3><div class="grid2"><div class="field"><label>Tournament</label><select id="rosterTournament"></select></div><div class="field"><label>Team Filter</label><select id="rosterTeam"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Add Player</label><select id="rosterPlayer"></select></div></div><div class="actions"><button class="btn primary add-player" id="addRosterPlayer" type="button"><span class="plus" aria-hidden="true">＋</span> Add Player</button></div><div id="rosterMsg" class="muted roster-message" role="status" aria-live="polite"></div><div id="tournamentRoster" class="list"></div></div></section><section id="notifications" class="panel"><div class="grid2"><div class="card"><h3>Send In-App Notification</h3><div class="field"><label>Title</label><input id="nTitle"></div><div class="field" style="margin-top:10px"><label>Message</label><textarea id="nBody"></textarea></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Audience</label><select id="nAudience"><option>All</option><option>Men</option><option>Women</option><option>Admins</option></select></div><div class="field"><label>Link</label><input id="nLink" placeholder="./events.html"></div></div><div class="actions"><button class="btn primary" id="sendNotification">Send Notification</button></div><div id="nMsg" class="muted"></div></div><div><h3>Recent Notifications</h3><div id="notificationList" class="list"></div></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session,players=[],practices=[],tournaments=[],tournamentRosterRows=[],activeSeasonPlayerIds=new Set();function openOperationsTab(id,updateUrl=true){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));if(updateUrl){const u=new URL(location.href);u.searchParams.set('tab',id);u.searchParams.delete('tournament');history.replaceState({},'',u);window.dispatchEvent(new Event('club:routechange'))}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openOperationsTab(b.dataset.tab));const initialTab=new URLSearchParams(location.search).get('tab');if(['overview','attendance','membership','tournaments','notifications'].includes(initialTab))openOperationsTab(initialTab,false);async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!p||!['admin','manager'].includes(p.role)){location.href='./player-dashboard.html';return}const [pl,pr]=await Promise.all([sb.from('players').select('id,name,team,status,membership_status,tournament_roster,jersey_number,user_id').order('name'),sb.from('practices').select('*').order('practice_date',{ascending:false}).limit(30)]);players=pl.data||[];practices=pr.data||[];const {data:currentSeason}=await sb.from('seasons').select('id').eq('is_current',true).maybeSingle();if(currentSeason){const {data:seasonRows}=await sb.from('season_registrations').select('player_id').eq('season_id',currentSeason.id).eq('status','Active');activeSeasonPlayerIds=new Set((seasonRows||[]).map(row=>row.player_id))}fillPlayers();fillPractices();await Promise.all([loadOverview(),loadPayments(),loadTournaments(),loadNotifications()]);$('loading').style.display='none';$('app').style.display='block'}function fillPlayers(){const o=players.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+esc(p.team)+'</option>').join('');$('payPlayer').innerHTML=o;$('rosterPlayer').innerHTML=o}function fillPractices(){$('attPractice').innerHTML=practices.map(p=>'<option value="'+p.id+'">'+esc(p.practice_date)+' — '+esc(p.title)+' ('+esc(p.team)+')</option>').join('')}async function loadOverview(){const [{data:a},{data:r},{data:pay}]=await Promise.all([sb.from('attendance_records').select('player_id,status'),sb.from('event_rsvps').select('response'),sb.from('membership_payments').select('status,player_id')]);const active=players.filter(p=>p.status==='Active').length,unpaid=players.filter(p=>p.membership_status!=='Paid').length,going=(r||[]).filter(x=>x.response==='Going').length,present=(a||[]).filter(x=>x.status==='Present').length;$('stats').innerHTML=[[active,'Active Players'],[unpaid,'Memberships Unpaid'],[going,'Current RSVPs Going'],[present,'Attendance Marks Present']].map(x=>'<div class="card"><div class="big">'+x[0]+'</div><div class="muted">'+x[1]+'</div></div>').join('');const missing=players.filter(p=>!p.jersey_number||p.membership_status!=='Paid');$('attention').innerHTML=missing.length?missing.slice(0,12).map(p=>'<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+(!p.jersey_number?'No jersey • ':'')+(p.membership_status!=='Paid'?'Membership unpaid':'')+'</div></div>').join(''):'<div class="empty">All clear.</div>';const totals={};(a||[]).forEach(x=>{totals[x.player_id]??={p:0,t:0};totals[x.player_id].t++;if(x.status==='Present')totals[x.player_id].p++});const leaders=players.map(p=>({name:p.name,pct:totals[p.id]?Math.round(totals[p.id].p/totals[p.id].t*100):0,total:totals[p.id]?.t||0})).filter(x=>x.total).sort((a,b)=>b.pct-a.pct).slice(0,8);$('leaders').innerHTML=leaders.length?leaders.map(x=>'<div class="item row"><b>'+esc(x.name)+'</b><span class="chip">'+x.pct+'%</span></div>').join(''):'<div class="empty">No attendance history yet.</div>'}$('loadAttendance').onclick=loadAttendance;async function loadAttendance(){const practiceId=$('attPractice').value,team=$('attTeam').value;if(!practiceId)return;const [{data:existing}]=await Promise.all([sb.from('attendance_records').select('*').eq('practice_id',practiceId)]);const map=new Map((existing||[]).map(x=>[x.player_id,x.status]));const roster=players.filter(p=>p.status==='Active'&&(team==='All'||p.team===team));$('attendanceRoster').innerHTML=roster.map(p=>'<div class="att-row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.team)+(p.jersey_number?' • #'+p.jersey_number:'')+'</div></div><div class="att-buttons" data-player="'+p.id+'">'+['Present','Absent','Excused'].map(s=>'<button class="btn mini '+(map.get(p.id)===s?'selected':'')+'" onclick="markAttendance(\''+p.id+'\',\''+s+'\',this)">'+s+'</button>').join('')+'</div></div>').join('')||'<div class="empty">No players found.</div>'}window.markAttendance=async(playerId,status,btn)=>{const practice_id=$('attPractice').value;const {error}=await sb.from('attendance_records').upsert({practice_id,player_id:playerId,status,marked_by:session.user.id,marked_at:new Date().toISOString()},{onConflict:'practice_id,player_id'});if(error){alert(error.message);return}btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');loadOverview()};$('markAllPresent').onclick=async()=>{const practice_id=$('attPractice').value,team=$('attTeam').value;const roster=players.filter(p=>p.status==='Active'&&(team==='All'||p.team===team));for(const p of roster){await sb.from('attendance_records').upsert({practice_id,player_id:p.id,status:'Present',marked_by:session.user.id,marked_at:new Date().toISOString()},{onConflict:'practice_id,player_id'})}loadAttendance();loadOverview()};$('savePayment').onclick=async()=>{const payload={player_id:$('payPlayer').value,period:$('payPeriod').value.trim(),amount:Number($('payAmount').value||0),status:$('payStatus').value,payment_date:$('payDate').value||null,method:$('payMethod').value.trim()||null,notes:$('payNotes').value.trim()||null,created_by:session.user.id};if(!payload.period){$('payMsg').textContent='Period is required.';return}const {error}=await sb.from('membership_payments').insert(payload);$('payMsg').textContent=error?.message||'Payment record saved.';if(!error){if(payload.status==='Paid')await sb.from('players').update({membership_status:'Paid'}).eq('id',payload.player_id);loadPayments();loadOverview()}};async function loadPayments(){const {data}=await sb.from('membership_payments').select('*,players(name,team)').order('created_at',{ascending:false}).limit(30);$('paymentList').innerHTML=(data||[]).map(x=>'<div class="item row"><div><b>'+esc(x.players?.name||'Player')+'</b><div class="muted">'+esc(x.period)+' • '+esc(x.status)+(x.method?' • '+esc(x.method):'')+'</div></div><span class="chip">$'+Number(x.amount||0).toFixed(2)+'</span></div>').join('')||'<div class="empty">No payment records yet.</div>'}$('createTournament').onclick=async()=>{const title=$('tTitle').value.trim();if(!title){$('tMsg').textContent='Tournament name is required.';return}const {error}=await sb.from('tournaments').insert({title,start_date:$('tStart').value||null,end_date:$('tEnd').value||null,location:$('tLocation').value.trim()||null,status:$('tStatus').value,notes:$('tNotes').value.trim()||null,created_by:session.user.id});$('tMsg').textContent=error?.message||'Tournament created.';if(!error)loadTournaments()};async function loadTournaments(){const selected=$('rosterTournament').value;const {data,error}=await sb.from('tournaments').select('*').order('start_date',{ascending:false});if(error){$('tournamentList').textContent='Could not load tournaments: '+error.message;return}tournaments=data||[];$('tournamentList').innerHTML=tournaments.map(t=>'<div class="item"><div class="row"><button type="button" class="tournament-link" data-tournament="'+t.id+'" aria-expanded="false" aria-controls="tournamentAttendees">'+esc(t.title)+' — View players going</button><span class="chip">'+esc(t.status)+'</span></div><div class="muted">'+esc(t.start_date||'Date TBA')+(t.location?' • '+esc(t.location):'')+'</div></div>').join('')||'<div class="empty">No tournaments yet.</div>';$('rosterTournament').innerHTML=tournaments.map(t=>'<option value="'+t.id+'">'+esc(t.title)+'</option>').join('');if(tournaments.some(t=>t.id===selected))$('rosterTournament').value=selected;loadTournamentRoster();const open=new URLSearchParams(location.search).get('tournament');if(open&&tournaments.some(t=>t.id===open))showTournamentAttendees(open)}$('tournamentList').addEventListener('click',e=>{const button=e.target.closest('[data-tournament]');if(button)showTournamentAttendees(button.dataset.tournament)});$('tournamentAttendees').addEventListener('click',e=>{if(!e.target.closest('[data-close-tournament]'))return;const panel=$('tournamentAttendees');panel.hidden=true;document.querySelectorAll('[data-tournament]').forEach(b=>b.setAttribute('aria-expanded','false'));const u=new URL(location.href);u.searchParams.delete('tournament');history.replaceState({},'',u);window.dispatchEvent(new Event('club:routechange'));$('tournamentList').scrollIntoView({behavior:'smooth',block:'start'})});async function showTournamentAttendees(id){const tournament=tournaments.find(t=>t.id===id);if(!tournament)return;const panel=$('tournamentAttendees');const url=new URL(location.href);url.searchParams.set('tab','tournaments');url.searchParams.set('tournament',id);history.replaceState({},'',url);window.dispatchEvent(new Event('club:routechange'));panel.hidden=false;panel.textContent='Loading players for '+tournament.title+'…';$('rosterTournament').value=id;loadTournamentRoster();document.querySelectorAll('[data-tournament]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.tournament===id)));panel.scrollIntoView({behavior:'smooth',block:'nearest'});const {data,error}=await sb.from('tournament_players').select('roster_status,jersey_number,players(name,team,jersey_number)').eq('tournament_id',id);if($('rosterTournament').value!==id)return;if(error){panel.textContent='Could not load players: '+error.message;return}const attending=(data||[]).filter(x=>['Interested','Selected','Confirmed'].includes(x.roster_status));const confirmed=attending.filter(x=>x.roster_status==='Confirmed').length;attending.sort((a,b)=>(a.roster_status==='Confirmed'?0:1)-(b.roster_status==='Confirmed'?0:1)||String(a.players?.name||'').localeCompare(String(b.players?.name||'')));panel.innerHTML='<button type="button" class="btn mini" data-close-tournament>← Back to Tournaments</button><h3>'+esc(tournament.title)+'</h3><div class="muted">'+attending.length+' on roster or interested • '+confirmed+' confirmed</div>'+(attending.length?attending.map(x=>'<div class="item row" style="margin-top:8px"><div><b>'+esc(x.players?.name||'Player')+'</b><div class="muted">'+esc(x.players?.team||'')+(x.jersey_number||x.players?.jersey_number?' • #'+esc(x.jersey_number||x.players?.jersey_number):'')+'</div></div><span class="chip">'+esc(x.roster_status)+'</span></div>').join(''):'<div class="empty" style="margin-top:10px">No players have selected “I Want to Go” yet.</div>')}$('rosterTournament').onchange=loadTournamentRoster;$('addRosterPlayer').onclick=async()=>{const button=$('addRosterPlayer'),message=$('rosterMsg'),tournament_id=$('rosterTournament').value,player_id=$('rosterPlayer').value;if(!tournament_id||!player_id){message.textContent='Choose a tournament and player first.';return}const p=players.find(x=>x.id===player_id);button.disabled=true;message.textContent='Adding '+(p?.name||'player')+'…';const {error}=await sb.from('tournament_players').upsert({tournament_id,player_id,roster_status:'Selected',jersey_number:p?.jersey_number||null,updated_at:new Date().toISOString()},{onConflict:'tournament_id,player_id'});button.disabled=false;if(error){message.textContent='Could not add player: '+error.message;return}message.textContent='✓ '+(p?.name||'Player')+' added to the roster.';await loadTournamentRoster();if(!$('tournamentAttendees').hidden)await showTournamentAttendees(tournament_id)};function updateRosterPlayerOptions(rows=tournamentRosterRows){const team=$('rosterTeam').value,active=new Set((rows||[]).filter(x=>['Interested','Selected','Confirmed'].includes(x.roster_status)).map(x=>x.player_id)),available=players.filter(p=>activeSeasonPlayerIds.has(p.id)&&(team==='All'||p.team===team)&&!active.has(p.id));$('rosterPlayer').innerHTML=available.length?available.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+esc(p.team)+'</option>').join(''):'<option value="">No available '+(team==='All'?'players':team.toLowerCase()+' players')+'</option>';$('rosterPlayer').disabled=!available.length;$('addRosterPlayer').disabled=!available.length}$('rosterTeam').onchange=()=>updateRosterPlayerOptions();async function loadTournamentRoster(){const id=$('rosterTournament').value;if(!id){tournamentRosterRows=[];$('tournamentRoster').innerHTML='<div class="empty">Create a tournament first.</div>';updateRosterPlayerOptions();return}const {data}=await sb.from('tournament_players').select('*,players(name,team)').eq('tournament_id',id);tournamentRosterRows=data||[];updateRosterPlayerOptions();const waitingForSelection=tournamentRosterRows.filter(x=>x.roster_status==='Interested');$('tournamentRoster').innerHTML=waitingForSelection.map(x=>'<div class="item"><div class="row"><b>'+esc(x.players?.name)+'</b><span class="chip">'+esc(x.roster_status)+'</span></div><div class="muted">Waiting for roster selection</div></div>').join('')||'<div class="empty">No players waiting to be selected.</div>'}window.cycleTP=async(id,field,vals)=>{const {data}=await sb.from('tournament_players').select(field).eq('id',id).single();const cur=data?.[field],next=vals[(vals.indexOf(cur)+1)%vals.length];await sb.from('tournament_players').update({[field]:next,updated_at:new Date().toISOString()}).eq('id',id);loadTournamentRoster()};$('sendNotification').onclick=async()=>{const title=$('nTitle').value.trim(),body=$('nBody').value.trim();if(!title||!body){$('nMsg').textContent='Title and message are required.';return}const {error}=await sb.from('club_notifications').insert({title,body,audience:$('nAudience').value,link:$('nLink').value.trim()||null,created_by:session.user.id});$('nMsg').textContent=error?.message||'Notification sent.';if(!error)loadNotifications()};async function loadNotifications(){const {data}=await sb.from('club_notifications').select('*').order('created_at',{ascending:false}).limit(30);$('notificationList').innerHTML=(data||[]).map(n=>'<div class="item"><div class="row"><b>'+esc(n.title)+'</b><span class="chip">'+esc(n.audience)+'</span></div><div style="margin-top:6px">'+esc(n.body)+'</div><div class="muted" style="margin-top:6px">'+new Date(n.created_at).toLocaleString()+'</div></div>').join('')||'<div class="empty">No notifications yet.</div>'}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script><script defer src="./header.js"></script></body></html>
