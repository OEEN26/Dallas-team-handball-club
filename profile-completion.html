<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19c957"><title>Dallas THC Profile Completion</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 70px}header{background:#111;border-bottom:1px solid #292929;padding:12px 14px}.bar{max-width:820px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900}.brand span{color:#19c957}.muted{color:#999;font-size:12px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.field textarea{min-height:90px}.barline{height:12px;background:#242424;border-radius:999px;overflow:hidden}.fill{height:100%;background:#19c957;width:0}.big{font-size:32px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.grid2{grid-template-columns:1fr}.bar{align-items:flex-start}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">PROFILE COMPLETION</div></div><div class="actions"><a class="btn primary" href="./player.html">My Profile</a><a class="btn" href="./club-hub.html">Club Hub</a></div></div></header><main class="wrap"><div id="loading" class="card">Loading profile…</div><div id="app" style="display:none"><div class="card"><div class="muted">PROFILE COMPLETION</div><div id="pct" class="big">0%</div><div class="barline"><div id="fill" class="fill"></div></div><div id="missing" class="muted" style="margin-top:8px"></div></div><div class="card"><h2>Public Player Details</h2><div class="grid2"><div class="field"><label>Full Name</label><input id="name"></div><div class="field"><label>Position</label><input id="position"></div><div class="field"><label>Nationality</label><input id="nationality" placeholder="Mexican, American, Cuban…"></div><div class="field"><label>Hometown</label><input id="hometown"></div><div class="field"><label>Date of Birth</label><input id="dob" type="date"></div><div class="field"><label>Years Playing</label><input id="years" type="number" min="0"></div></div><div class="field" style="margin-top:10px"><label>Bio</label><textarea id="bio"></textarea></div><div class="field" style="margin-top:10px"><label>Accomplishments</label><textarea id="accomplishments"></textarea></div><div class="field" style="margin-top:10px"><label>Tournaments Played</label><textarea id="tournaments"></textarea></div><div class="field" style="margin-top:10px"><label>Player History</label><textarea id="history"></textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="save">Save Details</button></div><div id="msg" class="muted"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);let session,player,pp;async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:p}=await sb.from('players').select('*').eq('user_id',session.user.id).maybeSingle();if(!p){location.href='./player.html';return}player=p;const {data:profile}=await sb.from('player_profiles').select('*').eq('player_id',p.id).maybeSingle();pp=profile||{};$('name').value=p.name||'';$('position').value=p.position||'';$('nationality').value=pp.nationality||'';$('hometown').value=pp.hometown||'';$('dob').value=pp.date_of_birth||'';$('years').value=pp.years_playing??'';$('bio').value=pp.bio||'';$('accomplishments').value=pp.accomplishments||'';$('tournaments').value=pp.tournaments_played||'';$('history').value=pp.player_history||'';score();$('loading').style.display='none';$('app').style.display='block'}function score(){const fields=[['Name',$('name').value],['Position',$('position').value],['Nationality',$('nationality').value],['Hometown',$('hometown').value],['Date of birth',$('dob').value],['Years playing',$('years').value],['Bio',$('bio').value],['Accomplishments',$('accomplishments').value],['Tournaments',$('tournaments').value],['Player history',$('history').value]];const done=fields.filter(x=>String(x[1]??'').trim()!=='').length,pct=Math.round(done/fields.length*100);$('pct').textContent=pct+'%';$('fill').style.width=pct+'%';$('missing').textContent=pct===100?'Profile complete!':'Still missing: '+fields.filter(x=>String(x[1]??'').trim()==='').map(x=>x[0]).join(', ')}document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',score));$('save').onclick=async()=>{const a=await sb.from('players').update({name:$('name').value.trim(),position:$('position').value.trim()||null}).eq('id',player.id);if(a.error){$('msg').textContent=a.error.message;return}const profile={nationality:$('nationality').value.trim()||null,hometown:$('hometown').value.trim()||null,date_of_birth:$('dob').value||null,years_playing:$('years').value===''?null:Number($('years').value),bio:$('bio').value.trim()||null,accomplishments:$('accomplishments').value.trim()||null,tournaments_played:$('tournaments').value.trim()||null,player_history:$('history').value.trim()||null,updated_at:new Date().toISOString()};let b;if(pp.player_id)b=await sb.from('player_profiles').update(profile).eq('player_id',player.id);else b=await sb.from('player_profiles').insert({player_id:player.id,user_id:session.user.id,...profile});$('msg').textContent=b.error?.message||'Profile details saved.';if(!b.error)score()};boot();</script></body></html>
