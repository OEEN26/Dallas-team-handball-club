<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19c957"><title>Season Registrations | Dallas THC</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d0a;color:#f4f7f4;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111912;border-bottom:1px solid #314136}.bar,.wrap{max-width:1100px;margin:auto;padding:14px 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{padding-top:24px;padding-bottom:80px}h1{margin:0;font-size:clamp(25px,5vw,34px)}h2{margin:0 0 8px;font-size:20px}.muted{color:#abbcaf}.card{background:#151d17;border:1px solid #35483b;border-radius:14px;padding:18px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.summary span{padding:9px 12px;border:1px solid #38523e;border-radius:9px;background:#183020}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{min-height:44px;border:1px solid #526457;background:#111912;color:white;border-radius:9px;padding:9px 12px;font:inherit}.controls input{flex:1;min-width:180px}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:#1e3123;border:1px solid #45674c;color:white;text-decoration:none;border-radius:9px;padding:9px 14px;font:inherit;cursor:pointer}.btn.primary{background:#19c957;border-color:#19c957;color:#07170b;font-weight:800}.btn:disabled{opacity:.55}.list{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.row h2{margin:0;font-size:19px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;border:1px solid #586957;color:#e4f7e7;font-size:14px;margin:5px 5px 5px 0}.badge.warn{border-color:#8b7440;color:#ffe09d}.row p{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.review{margin-top:12px;border-top:1px solid #35483b;padding-top:12px}.review summary{cursor:pointer;font-weight:700}.review dl{display:grid;grid-template-columns:160px 1fr;gap:7px 12px}.review dt{color:#aebeb1}.review dd{margin:0;overflow-wrap:anywhere}.notice{margin:14px 0;padding:13px;border-left:3px solid #19c957;background:#15251a}a{color:#96eaaa}#message{min-height:24px}@media(max-width:650px){.row{grid-template-columns:1fr}.review dl{grid-template-columns:1fr}.review dt{font-weight:700}.review dd{margin-bottom:8px}}
</style></head><body><header><div class="bar"><strong>Dallas Team Handball Club · Admin</strong><a class="btn" href="./index.html">Dashboard</a></div></header><main class="wrap"><h1>Season Registrations</h1><p id="season" class="muted">Loading current season…</p><div id="message" role="status"></div><div id="app" hidden><div class="summary"><span id="pendingCount">0 awaiting review</span><span id="missingCount">0 missing packet</span><span id="activeCount">0 active</span></div><div class="notice">A player becomes active only after you review their signed packet and approve it. Photo and video consent may be declined.</div><div class="controls"><input id="search" type="search" placeholder="Search players" aria-label="Search players"><select id="team" aria-label="Filter team"><option value="All">All teams</option><option>Men</option><option>Women</option></select><select id="filter" aria-label="Filter registration"><option value="review">Awaiting review</option><option value="missing">Missing packet</option><option value="active">Active</option><option value="all">All players</option></select></div><div id="list" class="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let players=[],registrations=new Map(),packets=new Map(),season;
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}const role=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(role.error||!['admin','manager'].includes(role.data?.role)){location.href='./player-dashboard.html';return}await load()}
async function load(){const [s,p]=await Promise.all([sb.from('seasons').select('id,name').eq('is_current',true).maybeSingle(),sb.from('players').select('id,name,team,user_id').is('deleted_at',null).order('name')]);if(s.error||p.error||!s.data){$('message').textContent='Unable to load the current season and players.';return}season=s.data;players=p.data||[];$('season').textContent=season.name+' season';const [r,pk]=await Promise.all([sb.from('season_registrations').select('id,player_id,status,activated_at').eq('season_id',season.id),sb.from('season_packets').select('id,player_id,document_version,participant_name,date_of_birth,signer_name,signer_capacity,guardian_email,guardian_phone,emergency_name,emergency_phone,medical_notes,media_consent,signed_at').eq('season_id',season.id).order('signed_at',{ascending:false})]);if(r.error||pk.error){$('message').textContent='Could not load signed packets. Refresh to try again.';return}registrations=new Map((r.data||[]).map(x=>[x.player_id,x]));packets=new Map();(pk.data||[]).forEach(x=>{if(!packets.has(x.player_id))packets.set(x.player_id,x)});$('message').textContent='';$('app').hidden=false;render()}
function state(p){const reg=registrations.get(p.id),packet=packets.get(p.id);return reg?.status==='Active'?'active':reg?.status==='Suspended'?'suspended':reg?.status==='Inactive'?'inactive':!packet?'missing':'review'}
function render(){const counts={review:0,missing:0,active:0};players.forEach(p=>{if(state(p) in counts)counts[state(p)]++});$('pendingCount').textContent=counts.review+' awaiting review';$('missingCount').textContent=counts.missing+' missing packet';$('activeCount').textContent=counts.active+' active';const q=$('search').value.trim().toLowerCase(),team=$('team').value,filter=$('filter').value;const rows=players.filter(p=>(filter==='all'||state(p)===filter)&&(team==='All'||p.team===team)&&(!q||p.name.toLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(p=>{const packet=packets.get(p.id),reg=registrations.get(p.id),st=state(p);return '<article class="card row"><div><h2>'+esc(p.name)+'</h2><span class="badge">'+esc(p.team||'No team')+'</span><span class="badge '+(st==='review'||st==='missing'?'warn':'')+'">'+(st==='review'?'Pending review':st==='missing'?'Missing signed packet':esc(reg?.status||'Pending'))+'</span>'+(packet?'<p class="muted">Signed '+new Date(packet.signed_at).toLocaleString()+' · Media '+(packet.media_consent?'accepted':'declined')+'</p><details class="review"><summary>Review registration and signature</summary><dl><dt>Document</dt><dd>'+esc(packet.document_version)+'</dd><dt>Participant</dt><dd>'+esc(packet.participant_name)+'</dd><dt>Date of birth</dt><dd>'+esc(packet.date_of_birth)+'</dd><dt>Signed by</dt><dd>'+esc(packet.signer_name)+' ('+esc(packet.signer_capacity)+')</dd><dt>Guardian contact</dt><dd>'+esc(packet.guardian_email||'Not applicable')+(packet.guardian_phone?' · '+esc(packet.guardian_phone):'')+'</dd><dt>Emergency contact</dt><dd>'+esc(packet.emergency_name)+' · '+esc(packet.emergency_phone)+'</dd><dt>Medical notes</dt><dd>'+esc(packet.medical_notes||'None supplied')+'</dd><dt>Required sections</dt><dd>Risk, liability release, emergency care, concussion, conduct, electronic signature</dd><dt>Photo and video</dt><dd>'+ (packet.media_consent?'Accepted':'Declined')+'</dd></dl></details>':'<p class="muted">The player needs to open Season Registration from their dashboard and submit the agreement.</p>')+'</div><div class="actions">'+(st==='review'?'<button class="btn primary" type="button" onclick="approve(\''+packet.id+'\',this)">Approve & activate</button>':'')+'<a class="btn" href="./player-view.html?id='+encodeURIComponent(p.id)+'&uid='+encodeURIComponent(p.user_id||'')+'">View player</a></div></article>'}).join(''):'<div class="card muted">No players match this filter.</div>'}
window.approve=async(id,button)=>{if(!confirm('You have reviewed the signed packet. Approve this player for '+season.name+'?'))return;button.disabled=true;button.textContent='Approving…';const {error}=await sb.rpc('approve_season_packet',{p_packet_id:id});if(error){button.disabled=false;button.textContent='Approve & activate';$('message').textContent=error.message;return}await load()};['search','team','filter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));boot().catch(()=>{$('message').textContent='Unable to load registrations. Please refresh.'});
</script><script defer src="./header.js"></script></body></html>
