<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Tournament Readiness</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar,.wrap{max-width:1180px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand span{color:#19c957}.muted{color:#999;font-size:12px}.wrap{padding:18px 14px 90px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field select{width:100%;min-height:44px;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.big{font-size:28px;font-weight:900}.player{margin:10px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.pill{padding:5px 8px;border-radius:999px;background:#102718;color:#9cf4b8;font-size:11px;white-space:nowrap}.ready{border-left:4px solid #19c957}.notready{border-left:4px solid #e5a93b}.empty{padding:18px;text-align:center;color:#aaa;border:1px dashed #333;border-radius:12px}.save-row{display:flex;align-items:center;gap:10px;margin-top:12px}.save-message{color:#9cf4b8;font-size:12px}@media(max-width:750px){.summary{grid-template-columns:1fr 1fr}.checks{grid-template-columns:1fr 1fr}.bar{align-items:flex-start}}@media(max-width:430px){.checks,.summary{grid-template-columns:1fr}.head{flex-direction:column}}</style></head>
<body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">TOURNAMENT READINESS</div></div><div class="actions"><a class="btn" href="./admin-operations.html?tab=tournaments">Tournaments</a><a class="btn primary" href="./">Dashboard</a></div></div></header>
<main class="wrap"><div id="loading" class="card">Loading tournament readiness…</div><div id="app" style="display:none"><div class="field"><label for="tournamentSelect">TOURNAMENT</label><select id="tournamentSelect"></select></div><div class="summary"><div class="card"><div class="muted">ON ROSTER</div><div class="big" id="goingCount">0</div></div><div class="card"><div class="muted">TOURNAMENT READY</div><div class="big" id="readyCount">0</div></div><div class="card"><div class="muted">NEEDS ATTENTION</div><div class="big" id="needsCount">0</div></div></div><div id="list"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1" integrity="sha384-q36VSR1ktH2hgqgm+0LDeyqPW8CyZHSxfDSttSPm5ReOJzB+sYThmh7D4fE+jWTs" crossorigin="anonymous"></script>
<script>
const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ'),$=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const statusOptions=(current,values)=>values.map(value=>'<option '+(value===current?'selected':'')+'>'+esc(value)+'</option>').join('');let tournaments=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const {data:profile}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!['admin','manager'].includes(profile?.role)){location.href='./player-dashboard.html';return}const {data,error}=await sb.from('tournaments').select('*').order('start_date',{ascending:false});if(error){$('loading').textContent='Could not load tournaments: '+error.message;return}tournaments=data||[];$('tournamentSelect').innerHTML=tournaments.map(item=>'<option value="'+item.id+'">'+esc(item.title)+' — '+esc(item.start_date||'Date TBA')+'</option>').join('');const params=new URLSearchParams(location.search),requested=params.get('tournament')||params.get('event');if(requested&&tournaments.some(item=>item.id===requested))$('tournamentSelect').value=requested;$('tournamentSelect').onchange=()=>{const url=new URL(location.href);url.searchParams.set('tournament',$('tournamentSelect').value);url.searchParams.delete('event');history.replaceState({},'',url);load()};await load();$('loading').style.display='none';$('app').style.display='block'}
async function load(){const tournamentId=$('tournamentSelect').value;if(!tournamentId){$('list').innerHTML='<div class="empty">Create a tournament first.</div>';setCounts(0,0);return}const {data,error}=await sb.from('tournament_players').select('id,player_id,roster_status,travel_status,hotel_status,waiver_status,fee_status,jersey_number,players(id,name,team,position,jersey_number,status)').eq('tournament_id',tournamentId);if(error){$('list').innerHTML='<div class="empty">Could not load the tournament roster: '+esc(error.message)+'</div>';setCounts(0,0);return}const roster=(data||[]).filter(row=>['Interested','Selected','Confirmed'].includes(row.roster_status));roster.sort((a,b)=>String(a.players?.name||'').localeCompare(String(b.players?.name||'')));let readyCount=0;$('list').innerHTML=roster.map(row=>{const jersey=row.jersey_number||row.players?.jersey_number,ready=['Selected','Confirmed'].includes(row.roster_status)&&['Confirmed','Not Needed'].includes(row.travel_status)&&['Confirmed','Not Needed'].includes(row.hotel_status)&&['Complete','Not Needed'].includes(row.waiver_status)&&['Paid','Waived'].includes(row.fee_status)&&!!jersey;if(ready)readyCount++;return '<article class="card player '+(ready?'ready':'notready')+'" data-row="'+row.id+'"><div class="head"><div><b>'+esc(row.players?.name||'Player')+'</b><div class="muted">'+esc(row.players?.position||'Player')+' • '+esc(row.players?.team||'')+' • '+(jersey?'#'+esc(jersey):'No jersey assigned')+'</div></div><span class="pill">'+(ready?'READY ✓':'NEEDS ITEMS')+'</span></div><div class="checks">'+field(row.id,'roster_status','ROSTER STATUS',row.roster_status,['Interested','Selected','Confirmed','Not Going'])+field(row.id,'travel_status','TRAVEL',row.travel_status,['Pending','Confirmed','Not Needed'])+field(row.id,'hotel_status','HOTEL',row.hotel_status,['Pending','Confirmed','Not Needed'])+field(row.id,'waiver_status','WAIVER',row.waiver_status,['Pending','Complete','Not Needed'])+field(row.id,'fee_status','TOURNAMENT FEE',row.fee_status,['Due','Paid','Waived'])+'<div class="field"><label>JERSEY</label><select disabled><option>'+(jersey?'#'+esc(jersey):'Not assigned')+'</option></select></div></div><div class="save-row"><button class="btn primary" type="button" onclick="savePlayer(\''+row.id+'\')">Save Readiness</button><span class="save-message" id="msg_'+row.id+'"></span></div></article>'}).join('')||'<div class="empty">No interested or selected players are attached to this tournament yet. Add them from Tournament Roster Manager.</div>';setCounts(roster.length,readyCount)}
function field(id,name,label,current,values){return '<div class="field"><label>'+label+'</label><select data-row="'+id+'" data-field="'+name+'">'+statusOptions(current,values)+'</select></div>'}function setCounts(total,ready){$('goingCount').textContent=total;$('readyCount').textContent=ready;$('needsCount').textContent=total-ready}
window.savePlayer=async id=>{const message=$('msg_'+id),payload={updated_at:new Date().toISOString()};document.querySelectorAll('[data-row="'+id+'"][data-field]').forEach(input=>payload[input.dataset.field]=input.value);message.textContent='Saving…';const {error}=await sb.from('tournament_players').update(payload).eq('id',id);if(error){message.textContent='Could not save: '+error.message;return}message.textContent='✓ Saved';await load()};boot();
</script><script defer src="./header.js"></script></body></html>
