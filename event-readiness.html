<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Event Readiness</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar,.wrap{max-width:1180px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand span{color:#19c957}.muted{color:#999;font-size:12px}.wrap{padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field select,.field input,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.big{font-size:28px;font-weight:900}.player{margin:10px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.check{background:#101010;border:1px solid #292929;border-radius:10px;padding:9px;display:flex;gap:7px;align-items:center}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.ready{border-left:4px solid #19c957}.notready{border-left:4px solid #e5a93b}.empty{padding:18px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}.pill{padding:5px 8px;border-radius:999px;background:#102718;color:#9cf4b8;font-size:11px}@media(max-width:750px){.summary{grid-template-columns:1fr 1fr}.checks{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}.bar{align-items:flex-start}}@media(max-width:390px){.checks,.summary{grid-template-columns:1fr}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">TOURNAMENT READINESS</div></div><div class="actions"><a class="btn" href="./events.html">Events</a><a class="btn primary" href="./">Dashboard</a></div></div></header><main class="wrap"><div id="loading" class="card">Loading readiness list…</div><div id="app" style="display:none"><div class="field"><label>EVENT</label><select id="eventSelect"></select></div><div class="summary"><div class="card"><div class="muted">GOING</div><div class="big" id="goingCount">0</div></div><div class="card"><div class="muted">TOURNAMENT READY</div><div class="big" id="readyCount">0</div></div><div class="card"><div class="muted">NEEDS ATTENTION</div><div class="big" id="needsCount">0</div></div></div><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let events=[],players=[],rows=[];async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!['admin','manager'].includes(p?.role)){location.href='./player-dashboard.html';return}const [{data:e},{data:pl}]=await Promise.all([sb.from('club_events').select('*').order('event_date',{ascending:false}),sb.from('players').select('id,name,team,position,jersey_number,status').is('deleted_at',null).order('name')]);events=e||[];players=pl||[];$('eventSelect').innerHTML=events.map(x=>'<option value="'+x.id+'">'+esc(x.title)+' — '+esc(x.event_date)+'</option>').join('');const q=new URLSearchParams(location.search).get('event');if(q&&events.some(x=>x.id===q))$('eventSelect').value=q;$('eventSelect').onchange=load;await load();$('loading').style.display='none';$('app').style.display='block'}async function load(){const id=$('eventSelect').value;if(!id){$('list').innerHTML='<div class="empty">Create an event first.</div>';return}const [{data:r},{data:ready}]=await Promise.all([sb.from('event_rsvps').select('*').eq('event_id',id).eq('response','Going'),sb.from('event_readiness').select('*').eq('event_id',id)]);const going=r||[];rows=ready||[];const ids=new Set(going.map(x=>x.player_id));const list=players.filter(x=>ids.has(x.id));let readyN=0;$('list').innerHTML=list.map(p=>{const x=rows.find(y=>y.player_id===p.id)||{};const ok=!!(x.confirmed&&x.usath_membership&&x.hotel_booked&&x.flight_arrival&&x.flight_departure&&x.ride_confirmed&&x.uniform_ready&&x.jersey_ready);if(ok)readyN++;return '<div class="card player '+(ok?'ready':'notready')+'"><div class="head"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.position||'Player')+' • '+esc(p.team)+' • '+(p.jersey_number?'#'+p.jersey_number:'No jersey assigned')+'</div></div><span class="pill">'+(ok?'READY ✓':'NEEDS ITEMS')+'</span></div><div class="checks">'+check(p.id,'confirmed','Confirmed',x.confirmed)+check(p.id,'usath_membership','USATH Membership',x.usath_membership)+check(p.id,'hotel_booked','Hotel / Airbnb',x.hotel_booked)+check(p.id,'ride_confirmed','Ride',x.ride_confirmed)+check(p.id,'uniform_ready','Uniform',x.uniform_ready)+check(p.id,'jersey_ready','Jersey',x.jersey_ready)+'</div><div class="details"><div class="field"><label>FLIGHT ARRIVAL</label><input data-p="'+p.id+'" data-f="flight_arrival" value="'+esc(x.flight_arrival||'')+'" placeholder="Example: Thu 7:57 PM"></div><div class="field"><label>FLIGHT DEPARTURE</label><input data-p="'+p.id+'" data-f="flight_departure" value="'+esc(x.flight_departure||'')+'" placeholder="Example: Mon 6:05 AM"></div><div class="field"><label>HOTEL / AIRBNB DETAILS</label><input data-p="'+p.id+'" data-f="hotel_details" value="'+esc(x.hotel_details||'')+'" placeholder="Hotel, Airbnb, roommate"></div><div class="field"><label>RIDE DETAILS</label><input data-p="'+p.id+'" data-f="ride_details" value="'+esc(x.ride_details||'')+'" placeholder="Driver or ride plan"></div></div><div class="field" style="margin-top:8px"><label>ADMIN NOTES</label><input data-p="'+p.id+'" data-f="admin_notes" value="'+esc(x.admin_notes||'')+'"></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="savePlayer(\''+p.id+'\')">Save Checklist</button></div></div>'}).join('')||'<div class="empty">Nobody has RSVP’d Going yet.</div>';$('goingCount').textContent=list.length;$('readyCount').textContent=readyN;$('needsCount').textContent=list.length-readyN}function check(id,f,label,v){return '<label class="check"><input type="checkbox" data-p="'+id+'" data-f="'+f+'" '+(v?'checked':'')+'><span>'+label+'</span></label>'}window.savePlayer=async pid=>{const payload={event_id:$('eventSelect').value,player_id:pid};document.querySelectorAll('[data-p="'+pid+'"]').forEach(el=>payload[el.dataset.f]=el.type==='checkbox'?el.checked:(el.value.trim()||null));payload.updated_at=new Date().toISOString();const {error}=await sb.from('event_readiness').upsert(payload,{onConflict:'event_id,player_id'});if(error)alert(error.message);else await load()};boot();</script></body></html>
