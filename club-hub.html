<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Club Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand span{color:#19c957}.muted{color:#999;font-size:12px}.wrap{max-width:1050px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:14px 0}.tab.active{background:#19c957;color:#061108;border-color:#19c957}.panel{display:none}.panel.active{display:block}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:14px}.list{display:grid;gap:10px}.item{background:#151515;border:1px solid #292929;border-radius:12px;padding:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.chip{display:inline-block;padding:4px 7px;border-radius:999px;border:1px solid #285d38;background:#102718;color:#9cf4b8;font-size:11px;margin:3px}.rsvp{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.selected{background:#19c957;color:#061108;border-color:#19c957}.big{font-size:28px;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{border-left:3px solid #19c957}.unread{background:#102718}.empty{padding:18px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.bar{align-items:flex-start}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">CLUB HUB</div></div><div class="actions"><a class="btn primary" href="./player-dashboard.html">Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading your club hub…</div><div id="app" style="display:none"><div class="tabs"><button class="btn tab active" data-tab="schedule">Schedule & RSVP</button><button class="btn tab" data-tab="attendance">Attendance</button><button class="btn tab" data-tab="membership">Membership</button><button class="btn tab" data-tab="tournaments">Tournaments</button><button class="btn tab" data-tab="notifications">Notifications</button></div><section id="schedule" class="panel active"><div class="grid2"><div><h3>Upcoming Practices</h3><div id="practiceList" class="list"></div></div><div><h3>Upcoming Events</h3><div id="eventList" class="list"></div></div></div></section><section id="attendance" class="panel"><div class="grid2"><div class="card"><div class="muted">YOUR ATTENDANCE</div><div id="attendancePct" class="big">—</div><div id="attendanceMeta" class="muted"></div></div><div class="card"><div class="muted">RSVP RELIABILITY</div><div id="reliabilityPct" class="big">—</div><div class="muted">Going RSVPs compared with recorded attendance.</div></div></div><div id="attendanceList" class="list" style="margin-top:12px"></div></section><section id="membership" class="panel"><div class="card"><h3>Membership Status</h3><div id="membershipStatus" class="big">—</div><div class="muted">Official player record</div></div><div id="paymentList" class="list" style="margin-top:12px"></div></section><section id="tournaments" class="panel"><div id="tournamentList" class="list"></div></section><section id="notifications" class="panel"><div id="notificationList" class="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session,me,rsvps=[];document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});async function boot(){({data:{session}}=await sb.auth.getSession());if(!session){location.href='./';return}const {data:p}=await sb.from('players').select('id,name,team,membership_status').eq('user_id',session.user.id).maybeSingle();if(!p){location.href='./player.html';return}me=p;await Promise.all([loadSchedule(),loadAttendance(),loadMembership(),loadTournaments(),loadNotifications()]);$('loading').style.display='none';$('app').style.display='block'}async function loadSchedule(){const today=new Date().toISOString().slice(0,10);const [{data:pr},{data:ev},{data:r}]=await Promise.all([sb.from('practices').select('*').in('team',['All',me.team]).gte('practice_date',today).order('practice_date').order('start_time'),sb.from('club_events').select('*').in('team',['All',me.team]).gte('event_date',today).order('event_date').order('start_time'),sb.from('event_rsvps').select('*').eq('player_id',me.id)]);rsvps=r||[];$('practiceList').innerHTML=(pr||[]).map(p=>renderScheduleItem('practice',p)).join('')||'<div class="empty">No upcoming practices.</div>';$('eventList').innerHTML=(ev||[]).map(e=>renderScheduleItem('event',e)).join('')||'<div class="empty">No upcoming events.</div>'}function renderScheduleItem(type,x){const id=x.id,date=type==='practice'?x.practice_date:x.event_date,title=x.title,team=x.team,time=x.start_time?.slice(0,5)||'TBA',existing=rsvps.find(r=>(type==='practice'?r.practice_id:r.event_id)===id)?.response;return '<div class="item"><div class="row"><div><b>'+esc(title)+'</b><div class="muted">'+esc(date)+' • '+esc(team)+' • '+esc(time)+(x.location?' • '+esc(x.location):'')+'</div></div><span class="chip">'+esc(type==='practice'?'Practice':x.event_type||'Event')+'</span></div><div class="rsvp">'+['Going','Maybe','Not Going'].map(s=>'<button class="btn '+(existing===s?'selected':'')+'" onclick="setRsvp(\''+type+'\',\''+id+'\',\''+s+'\',this)">'+s+'</button>').join('')+'</div></div>'}window.setRsvp=async(type,id,response,btn)=>{const existing=rsvps.find(r=>(type==='practice'?r.practice_id:r.event_id)===id);let q;if(existing)q=await sb.from('event_rsvps').update({response,updated_at:new Date().toISOString()}).eq('id',existing.id);else q=await sb.from('event_rsvps').insert({[type==='practice'?'practice_id':'event_id']:id,player_id:me.id,user_id:session.user.id,response});if(q.error){alert(q.error.message);return}btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');loadSchedule();loadAttendance()};async function loadAttendance(){const {data:a}=await sb.from('attendance_records').select('*,practices(title,practice_date),club_events(title,event_date)').eq('player_id',me.id).order('marked_at',{ascending:false});const rows=a||[],present=rows.filter(x=>x.status==='Present').length,pct=rows.length?Math.round(present/rows.length*100):0;$('attendancePct').textContent=rows.length?pct+'%':'—';$('attendanceMeta').textContent=rows.length?present+' present out of '+rows.length+' records':'No attendance recorded yet.';const going=rsvps.filter(x=>x.response==='Going').length;$('reliabilityPct').textContent=going&&rows.length?Math.min(100,Math.round(present/going*100))+'%':'—';$('attendanceList').innerHTML=rows.map(x=>{const title=x.practices?.title||x.club_events?.title||'Club activity',date=x.practices?.practice_date||x.club_events?.event_date||'';return '<div class="item row"><div><b>'+esc(title)+'</b><div class="muted">'+esc(date)+'</div></div><span class="chip">'+esc(x.status)+'</span></div>'}).join('')||'<div class="empty">No attendance history yet.</div>'}async function loadMembership(){$('membershipStatus').textContent=me.membership_status||'Unknown';const {data}=await sb.from('membership_payments').select('*').eq('player_id',me.id).order('created_at',{ascending:false});$('paymentList').innerHTML=(data||[]).map(x=>'<div class="item row"><div><b>'+esc(x.period)+'</b><div class="muted">'+esc(x.status)+(x.payment_date?' • '+esc(x.payment_date):'')+(x.method?' • '+esc(x.method):'')+'</div></div><span class="chip">$'+Number(x.amount||0).toFixed(2)+'</span></div>').join('')||'<div class="empty">No membership payment history yet.</div>'}async function loadTournaments(){const {data}=await sb.from('tournament_players').select('*,tournaments(*)').eq('player_id',me.id);$('tournamentList').innerHTML=(data||[]).map(x=>'<div class="item"><div class="row"><b>'+esc(x.tournaments?.title||'Tournament')+'</b><span class="chip">'+esc(x.roster_status)+'</span></div><div class="muted">'+esc(x.tournaments?.start_date||'Date TBA')+(x.tournaments?.location?' • '+esc(x.tournaments.location):'')+'</div><div style="margin-top:8px"><span class="chip">Travel: '+esc(x.travel_status)+'</span><span class="chip">Hotel: '+esc(x.hotel_status)+'</span><span class="chip">Waiver: '+esc(x.waiver_status)+'</span><span class="chip">Fee: '+esc(x.fee_status)+'</span></div></div>').join('')||'<div class="empty">You are not on a tournament roster yet.</div>'}async function loadNotifications(){const [{data:n},{data:reads}]=await Promise.all([sb.from('club_notifications').select('*').in('audience',['All',me.team]).order('created_at',{ascending:false}).limit(50),sb.from('notification_reads').select('notification_id').eq('user_id',session.user.id)]);const seen=new Set((reads||[]).map(x=>x.notification_id));$('notificationList').innerHTML=(n||[]).map(x=>'<div class="item notice '+(!seen.has(x.id)?'unread':'')+'" onclick="readNotification(\''+x.id+'\',\''+esc(x.link||'')+'\')"><div class="row"><b>'+esc(x.title)+'</b>'+(!seen.has(x.id)?'<span class="chip">New</span>':'')+'</div><div style="margin-top:6px">'+esc(x.body)+'</div><div class="muted" style="margin-top:6px">'+new Date(x.created_at).toLocaleString()+'</div></div>').join('')||'<div class="empty">No notifications.</div>'}window.readNotification=async(id,link)=>{await sb.from('notification_reads').upsert({notification_id:id,user_id:session.user.id,read_at:new Date().toISOString()},{onConflict:'notification_id,user_id'});if(link)location.href=link;else loadNotifications()};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
