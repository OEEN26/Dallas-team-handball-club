<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Team Profiles</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{color:#19c957}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.muted{color:#999;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs .active{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.head h1{margin:0}.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.player{background:#151515;border:1px solid #292929;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none;position:relative}.player img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}.info{padding:12px}.number{position:absolute;top:10px;left:10px;background:#090909dd;border:1px solid #19c957;color:#9cf4b8;border-radius:999px;padding:6px 9px;font-weight:900}.name{font-size:18px;font-weight:900;line-height:1.15}.meta{margin-top:6px;color:#aaa;font-size:12px}.chips{margin-top:8px}.chip{display:inline-block;margin:3px 5px 0 0;padding:4px 7px;border-radius:999px;background:#102718;border:1px solid #285d38;color:#9cf4b8;font-size:11px}.empty{padding:24px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.lineup{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.lineup{grid-template-columns:repeat(2,1fr)}.name{font-size:16px}}@media(max-width:390px){.lineup{grid-template-columns:1fr 1fr;gap:8px}.info{padding:9px}.number{top:7px;left:7px;padding:4px 7px}}</style></head><body><header><div class="bar"><div class="brand"><img src="./Dallas-thc-logo.png.JPG" class="logo" alt="Dallas THC"><div>Dallas <span>THC</span><div class="muted">ADMIN • TEAM PROFILES</div></div></div><div class="top-actions"><a class="btn" href="./">Admin Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div class="tabs"><a id="menTab" class="btn" href="./admin-team-profiles.html?team=Men">Men</a><a id="womenTab" class="btn" href="./admin-team-profiles.html?team=Women">Women</a></div><div class="head"><div><h1 id="title">Team Profiles</h1><div class="muted">Players ordered by jersey number. Unassigned players appear last.</div></div><div id="count" class="muted"></div></div><div id="loading" class="empty">Loading team profiles…</div><div id="lineup" class="lineup" style="display:none"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkZnNodGpyeGJ0eWRvYWdoaGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDU0NjIsImV4cCI6MjEwMzI4MTQ2Mn0.WQL24YgZ2uUu-telRRNk2477FFWAbL9GIzyA5hdnq8k');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!prof||!['admin','manager'].includes(prof.role)){location.href='./player-dashboard.html';return}const team=new URLSearchParams(location.search).get('team')==='Women'?'Women':'Men';$('title').textContent=team+' Team Profiles';$(team==='Men'?'menTab':'womenTab').classList.add('active');const {data,error}=await sb.from('player_bio_public').select('*').eq('team',team).order('jersey_number',{ascending:true,nullsFirst:false}).order('name');if(error){$('loading').textContent=error.message;return}const players=data||[];$('count').textContent=players.length+' players';$('lineup').innerHTML=players.map(p=>{const href='./player-view.html?uid='+encodeURIComponent(p.user_id||'')+'&id='+encodeURIComponent(p.id);return '<a class="player" href="'+href+'"><div class="number">'+(p.jersey_number?'#'+p.jersey_number:'—')+'</div><img src="'+esc(p.profile_photo_url||'./Dallas-thc-logo.png.JPG')+'" alt="'+esc(p.name)+'"><div class="info"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.position||'Player')+'</div><div class="chips"><span class="chip">'+esc(p.status||'')+'</span><span class="chip">'+(p.jersey_number?'#'+p.jersey_number:'Unassigned')+'</span></div></div></a>'}).join('');$('loading').style.display=players.length?'none':'block';if(!players.length)$('loading').textContent='No players found for this team.';$('lineup').style.display=players.length?'grid':'none'}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
