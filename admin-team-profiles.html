<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Team Profiles</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{color:#19c957}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.muted{color:#999;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs .active{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.head h1{margin:0}.lineup{display:flex;flex-direction:column;gap:10px}.player{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:stretch;background:#151515;border:1px solid #292929;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none;position:relative;min-height:112px}.photo-wrap{position:relative;background:#202020}.player img{width:112px;height:100%;min-height:112px;object-fit:cover;display:block}.number{position:absolute;left:7px;bottom:7px;background:#090909e6;border:1px solid #19c957;color:#9cf4b8;border-radius:999px;padding:5px 8px;font-weight:900;font-size:12px}.info{padding:12px 14px 12px 0;min-width:0}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:20px;font-weight:900;line-height:1.1}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;border:1px solid #285d38;background:#102718;color:#9cf4b8;white-space:nowrap}.status.inactive{border-color:#5a3434;background:#2a1515;color:#ffaaaa}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;margin-top:9px}.detail{min-width:0}.label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em}.value{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bio{margin-top:9px;color:#aaa;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{padding:24px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.dashboard-nav{margin-bottom:12px}@media(max-width:650px){.player{grid-template-columns:94px 1fr;min-height:105px}.player img{width:94px;min-height:105px}.info{padding:10px 10px 10px 0}.name{font-size:17px}.details{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}.top-actions .btn{padding:8px 10px;font-size:12px}}@media(max-width:390px){.player{grid-template-columns:86px 1fr}.player img{width:86px}.details{grid-template-columns:1fr 1fr}.status{font-size:10px;padding:4px 6px}.name{font-size:16px}}</style></head><body><header><div class="bar"><div class="brand"><img src="./Dallas-thc-logo.png.JPG" class="logo" alt="Dallas THC"><div>Dallas <span>THC</span><div class="muted">ADMIN • TEAM PROFILES</div></div></div><div class="top-actions"><a class="btn primary" href="./index.html">← Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div class="dashboard-nav"><a class="btn" href="./index.html">← Back to Admin Dashboard</a></div><div class="tabs"><a id="menTab" class="btn" href="./admin-team-profiles.html?team=Men">Men</a><a id="womenTab" class="btn" href="./admin-team-profiles.html?team=Women">Women</a></div><div class="head"><div><h1 id="title">Team Profiles</h1><div class="muted">Roster list ordered by jersey number. Tap any player to open the full profile.</div></div><div id="count" class="muted"></div></div><div id="loading" class="empty">Loading team profiles…</div><div id="lineup" class="lineup" style="display:none"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkZnNodGpyeGJ0eWRvYWdoaGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDU0NjIsImV4cCI6MjEwMzI4MTQ2Mn0.WQL24YgZ2uUu-telRRNk2477FFWAbL9GIzyA5hdnq8k');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function ageFromDob(d){if(!d)return null;const b=new Date(d+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!prof||!['admin','manager'].includes(prof.role)){location.href='./player-dashboard.html';return}const team=new URLSearchParams(location.search).get('team')==='Women'?'Women':'Men';$('title').textContent=team+' Team Profiles';$(team==='Men'?'menTab':'womenTab').classList.add('active');const {data,error}=await sb.from('player_bio_public').select('*').eq('team',team).order('jersey_number',{ascending:true,nullsFirst:false}).order('name');if(error){$('loading').textContent=error.message;return}const players=data||[];$('count').textContent=players.length+' players';$('lineup').innerHTML=players.map(p=>{const href='./player-view.html?uid='+encodeURIComponent(p.user_id||'')+'&id='+encodeURIComponent(p.id);const age=ageFromDob(p.date_of_birth);const active=String(p.status||'').toLowerCase()==='active';return '<a class="player" href="'+href+'"><div class="photo-wrap"><img src="'+esc(p.profile_photo_url||'./Dallas-thc-logo.png.JPG')+'" alt="'+esc(p.name)+'"><div class="number">'+(p.jersey_number?'#'+p.jersey_number:'UNASSIGNED')+'</div></div><div class="info"><div class="topline"><div class="name">'+esc(p.name)+'</div><span class="status '+(active?'':'inactive')+'">'+esc(p.status||'Unknown')+'</span></div><div class="details"><div class="detail"><div class="label">Position</div><div class="value">'+esc(p.position||'—')+'</div></div><div class="detail"><div class="label">Jersey</div><div class="value">'+(p.jersey_number?'#'+p.jersey_number:'Unassigned')+'</div></div><div class="detail"><div class="label">Nationality</div><div class="value">'+esc(p.nationality||'—')+'</div></div><div class="detail"><div class="label">Hometown</div><div class="value">'+esc(p.hometown||'—')+'</div></div><div class="detail"><div class="label">Age</div><div class="value">'+(age??'—')+'</div></div><div class="detail"><div class="label">Years Playing</div><div class="value">'+(p.years_playing??'—')+'</div></div></div><div class="bio">'+esc(p.bio||'No player bio added yet.')+'</div></div></a>'}).join('');$('loading').style.display=players.length?'none':'block';if(!players.length)$('loading').textContent='No players found for this team.';$('lineup').style.display=players.length?'flex':'none'}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
