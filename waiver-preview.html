<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiver preview | Dallas THC</title><style>*{box-sizing:border-box}body{margin:0;background:#090d0a;color:#f5f7f5;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{max-width:800px;margin:auto;padding:18px}.top a{color:#9aefb1}.note{border:1px solid #536d59;border-radius:10px;padding:12px;margin-top:12px;background:#14251a}#preview input,#preview textarea{opacity:.75}#preview .choice{cursor:default}</style></head><body><div class="top"><a href="./season-registrations.html">← Season Registrations</a><div class="note"><strong>Admin preview</strong><br>This shows the current player registration form and waiver wording. All fields are disabled here. Players sign from their own dashboard.</div></div><div id="preview" class="top" role="status">Loading waiver preview…</div><script>
fetch('./season-registration.html',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('The season registration page is unavailable.');return response.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),source=doc.querySelector('main'),style=doc.querySelector('style');if(!source||!style)throw Error('The waiver could not be read.');document.head.append(style.cloneNode(true));source.querySelector('#packet')?.removeAttribute('hidden');source.querySelector('#seasonName').textContent='2026–27 player form · read-only example';source.querySelector('#status').textContent='';source.querySelector('#message').textContent='';source.querySelector('#submit')?.remove();source.querySelectorAll('input,textarea,select,button').forEach(input=>input.disabled=true);const target=document.getElementById('preview');target.replaceWith(source);}).catch(error=>{document.getElementById('preview').textContent=error.message});
</script></body></html>
