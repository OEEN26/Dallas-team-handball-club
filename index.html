<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTHC Club Manager V4</title>
<style>
body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:14px;background:#111;border-bottom:1px solid #292929;position:sticky;top:0;z-index:4}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand span{color:#19c957}.wrap{max-width:1100px;margin:auto;padding:18px 14px 60px}.nav{display:flex;gap:7px;overflow:auto;margin-top:12px}.nav button,.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px}.nav button.active,.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.view{display:none}.view.active{display:block}.screen{display:none}.screen.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#151515;border:1px solid #292929;border-radius:12px;padding:14px}.big{font-size:25px;font-weight:900}.muted{color:#999;font-size:12px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{min-height:58px;border:1px solid #303030;background:#111;color:white;border-radius:8px;padding:6px}.taken{background:#14371e;border-color:#28793e}.reserved{background:#3d300f;border-color:#80651e}.table{overflow:auto;margin-top:12px}.table table{width:100%;min-width:760px;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #292929;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:#999;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:10px;background:#0e0e0e;color:white;border:1px solid #303030;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:15px}.modal.open{display:flex}.sheet{background:#171717;border:1px solid #333;border-radius:15px;padding:18px;width:min(650px,95vw)}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(5,1fr)}.form{grid-template-columns:1fr}}
</style></head><body>
<header><div class="bar"><div class="brand">Dallas Team <span>Handball</span> Club</div><button class="btn" id="logout">Log out</button></div></header>
<div class="wrap">
<div id="login" class="view active"><div class="card"><h2>Club Admin Login</h2><p class="muted">Sign in with your club admin account.</p><div class="form"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><div class="actions"><button class="btn primary" id="signIn">Sign In</button><button class="btn" id="signUp">Create Account</button></div><div id="authMsg" class="muted"></div></div></div>
<div id="app" class="view">
<div class="nav"><button data-view="dashboard">Dashboard</button><button data-view="men">Men</button><button data-view="women">Women</button><button data-view="orders">Jersey Orders</button></div>
<section id="dashboard" class="screen"><h2>Club Dashboard</h2><div class="cards" id="stats"></div></section>
<section id="men" class="screen"><h2>Men's Team</h2><div class="actions"><button class="btn primary" onclick="addPlayer('Men')">+ Add Player</button><button class="btn" onclick="toggleNumbers('Men')">Jersey Numbers</button></div><div id="menRoster" class="table"></div><div id="menNumbers" style="display:none"></div></section>
<section id="women" class="screen"><h2>Women's Team</h2><div class="actions"><button class="btn primary" onclick="addPlayer('Women')">+ Add Player</button><button class="btn" onclick="toggleNumbers('Women')">Jersey Numbers</button></div><div id="womenRoster" class="table"></div><div id="womenNumbers" style="display:none"></div></section>
<section id="orders" class="screen"><h2>Jersey Orders</h2><div id="ordersTable" class="table"></div></section></div></div>
<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">Player</h3><div class="form">
<div class="field"><label>Name</label><input id="pName"></div><div class="field"><label>Team</label><select id="pTeam"><option>Men</option><option>Women</option></select></div>
<div class="field"><label>Phone</label><input id="pPhone"></div><div class="field"><label>Email</label><input id="pEmail" type="email"></div>
<div class="field"><label>Position</label><input id="pPosition"></div><div class="field"><label>Jersey #</label><select id="pNum"></select></div>
<div class="field"><label>Shirt Size</label><input id="pSize"></div><div class="field"><label>Status</label><select id="pStatus"><option>Active</option><option>Standby</option><option>Inactive</option><option>Reserved</option></select></div>
<div class="field"><label>Membership</label><select id="pMembership"><option>Paid</option><option>Unpaid</option></select></div><div class="field"><label>Tournament Roster</label><select id="pTournament"><option value="true">Yes</option><option value="false">No</option></select></div>
</div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePlayer()">Save Player</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXe2');let editing=null;
const $=x=>document.getElementById(x);
function showView(v){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='dashboard')loadStats();if(v==='men'||v==='women')loadTeam(v==='men'?'Men':'Women');if(v==='orders')loadOrders()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
async function auth(){let {data}=await sb.auth.getSession();$('login').classList.toggle('active',!data.session);$('app').classList.toggle('active',!!data.session);if(data.session)showView('dashboard')}
$('signIn').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?.message||'Signed in';auth()};
$('signUp').onclick=async()=>{let {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?.message||'Account created. Check your email.'};
$('logout').onclick=async()=>{await sb.auth.signOut();auth()};
async function loadStats(){let {data:p}=await sb.from('players').select('*');let {data:o}=await sb.from('jersey_orders').select('*');p=p||[];o=o||[];let nums=(t)=>99-new Set(p.filter(x=>x.team===t&&x.jersey_number).map(x=>x.jersey_number)).size;$('stats').innerHTML=[[p.filter(x=>x.status==='Active').length,'Active Players'],[p.filter(x=>x.membership_status==='Paid').length,'Memberships Paid'],[p.filter(x=>x.membership_status==='Unpaid').length,'Outstanding Memberships'],[o.filter(x=>x.order_status==='Not Ordered').length,'Jerseys Needing Orders'],[o.filter(x=>x.order_status==='Received').length,'Jerseys Received'],[p.filter(x=>x.tournament_roster&&x.status==='Active').length,'Tournament Roster'],[nums('Men'),'Men Numbers Available'],[nums('Women'),'Women Numbers Available']].map(x=>'<div class="card"><div class="big">'+x[0]+'</div><div class="muted">'+x[1]+'</div></div>').join('')}
async function loadTeam(team){let {data:p,error}=await sb.from('players').select('*').eq('team',team).order('jersey_number',{ascending:true,nullsFirst:false});if(error)return alert(error.message);let body=(p||[]).map(x=>'<tr><td>'+x.name+'</td><td>#'+(x.jersey_number||'—')+'</td><td>'+(x.position||'—')+'</td><td>'+x.status+'</td><td>'+(x.shirt_size||'—')+'</td><td>'+x.membership_status+'</td><td>'+(x.tournament_roster?'Yes':'No')+'</td><td><button class="btn" onclick="editPlayer(\''+x.id+'\')">Edit</button> <button class="btn" onclick="deletePlayer(\''+x.id+'\')">Delete</button></td></tr>').join('');$(team==='Men'?'menRoster':'womenRoster').innerHTML='<table><thead><tr><th>Name</th><th>#</th><th>Position</th><th>Status</th><th>Size</th><th>Membership</th><th>Tournament</th><th></th></tr></thead><tbody>'+body+'</tbody></table>';renderNumbers(team,p||[])}
function renderNumbers(team,p){let taken=new Map(p.filter(x=>x.jersey_number).map(x=>[x.jersey_number,x]));$(team==='Men'?'menNumbers':'womenNumbers').innerHTML='<div class="actions"><button class="btn" onclick="toggleNumbers(\''+team+'\')">Hide Numbers</button></div><div class="grid">'+Array.from({length:99},(_,i)=>{let n=i+1,x=taken.get(n);return '<button class="num '+(x?(x.status==='Reserved'?'reserved':'taken'):'free')+'" onclick="'+(x?'editPlayer(\''+x.id+'\')':'addNumber(\''+team+'\','+n+')')+'"><b>#'+n+'</b><span>'+(x?x.name:'AVAILABLE')+'</span></button>'}).join('')+'</div>'}
function toggleNumbers(t){let e=$(t==='Men'?'menNumbers':'womenNumbers');e.style.display=e.style.display==='none'?'block':'none'}
function addNumber(team,n){openModal({team,jersey_number:n,status:'Active',membership_status:'Unpaid',tournament_roster:false})}
function addPlayer(team){openModal({team})}
async function editPlayer(id){let {data}=await sb.from('players').select('*').eq('id',id).single();openModal(data)}
function openModal(p){editing=p?.id||null;$('modalTitle').textContent=editing?'Edit Player':'Add Player';$('pName').value=p?.name||'';$('pTeam').value=p?.team||'Men';$('pPhone').value=p?.phone||'';$('pEmail').value=p?.email||'';$('pPosition').value=p?.position||'';$('pSize').value=p?.shirt_size||'';$('pStatus').value=p?.status||'Active';$('pMembership').value=p?.membership_status||'Unpaid';$('pTournament').value=String(p?.tournament_roster||false);fillNums(p?.jersey_number);$('modal').classList.add('open')}
async function fillNums(cur){let {data}=await sb.from('players').select('id,jersey_number').eq('team',$('pTeam').value);let taken=new Set((data||[]).filter(x=>x.id!==editing&&x.jersey_number).map(x=>x.jersey_number));$('pNum').innerHTML='<option value="">No number</option>'+Array.from({length:99},(_,i)=>i+1).map(n=>'<option value="'+n+'" '+(n===cur?'selected':'')+' '+(taken.has(n)?'disabled':'')+'>#'+n+(taken.has(n)?' — TAKEN':'')+'</option>').join('')}
$('pTeam').onchange=()=>fillNums();function closeModal(){$('modal').classList.remove('open');editing=null}
async function savePlayer(){let name=$('pName').value.trim();if(!name){alert('Name is required. Tap Cancel to close without saving.');return}let payload={name,team:$('pTeam').value,phone:$('pPhone').value,email:$('pEmail').value,position:$('pPosition').value,jersey_number:Number($('pNum').value)||null,shirt_size:$('pSize').value,status:$('pStatus').value,membership_status:$('pMembership').value,tournament_roster:$('pTournament').value==='true'};let r=editing?await sb.from('players').update(payload).eq('id',editing):await sb.from('players').insert(payload);if(r.error)alert(r.error.message);else{closeModal();showView(payload.team==='Men'?'men':'women')}}
async function deletePlayer(id){if(confirm('Delete this player and their jersey orders?')){let r=await sb.from('players').delete().eq('id',id);if(r.error)alert(r.error.message);else showView('men')}}
async function loadOrders(){let {data}=await sb.from('jersey_orders').select('*,players(name,team)').order('created_at',{ascending:false});$('ordersTable').innerHTML='<table><thead><tr><th>Player</th><th>Team</th><th>Size</th><th>#</th><th>Status</th><th>Delivered</th><th>Order Date</th></tr></thead><tbody>'+(data||[]).map(o=>'<tr><td>'+(o.players?.name||'')+'</td><td>'+(o.players?.team||'')+'</td><td>'+(o.size||'—')+'</td><td>#'+(o.jersey_number||'—')+'</td><td>'+o.order_status+'</td><td>'+(o.delivered?'Yes':'No')+'</td><td>'+(o.order_date||'—')+'</td></tr>').join('')+'</tbody></table>'}
auth();
</script></body></html>
