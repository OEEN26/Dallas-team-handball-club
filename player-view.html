E</div></div></div><a class="btn" href="./player-dashboard.html">Dashboard</a></div></header><main class="wrap"><div id="loading" class="card">Loading player…</div><div id="profile" style="display:none"><div class="card hero"><img id="photo" src="./Dallas-thc-logo.png.JPG"><div><h1 id="name"></h1><div id="chips"></div><div class="muted" id="hometown" style="margin-top:10px"></div></div></div><div class="grid2"><div class="card"><h3>Player Bio</h3><div id="bio" class="bio muted"></div></div><div class="card"><h3>Accomplishments</h3><div id="accomplishments" class="bio muted"></div></div><div class="card"><h3>Tournaments Played</h3><div id="tournaments" class="bio muted"></div></div><div class="card"><h3>Player History</h3><div id="history" class="bio muted"></div></div></div><div class="card section"><h3>Career Gallery</h3><div id="gallery" class="gallery"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkZnNodGpyeGJ0eWRvYWdoaGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDU0NjIsImV4cCI6MjEwMzI4MTQ2Mn0.WQL24YgZ2uUu-telRRNk2477FFWAbL9GIzyA5hdnq8k');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function age(d){if(!d)return null;const b=new Date(d+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const params=new URLSearchParams(location.search),uid=params.get('uid'),id=params.get('id');if(!uid&&!id){location.href='./player-dashboard.html';return}let q=sb.from('player_bio_public').select('*');q=uid?q.eq('user_id',uid):q.eq('id',id);let {data:p,error}=await q.maybeSingle();if((error||!p)&&id&&uid){const retry=await sb.from('player_bio_public').select('*').eq('id',id).maybeSingle();p=retry.data;error=retry.error}if(error||!p){$('loading').textContent='Player profile not found.';console.error('Profile lookup failed',error,{uid,id});return}if(p.user_id===session.user.id){location.href='./player.html';return}const {data:g}=await sb.from('player_gallery').select('*').eq('player_id',p.id).order('created_at',{ascending:false});$('photo').src=p.profile_photo_url||'./Dallas-thc-logo.png.JPG';$('name').textContent=p.name;const a=age(p.date_of_birth);$('chips').innerHTML='<span class="chip">'+esc(p.team)+' Team</span><span class="chip">'+esc(p.position||'Player')+'</span><span class="chip">'+(p.jersey_number?'#'+p.jersey_number:'Unassigned')+'</span>'+(a!=null?'<span class="chip">'+a+' years old</span>':'');$('hometown').textContent=[p.hometown,p.years_playing!=null?p.years_playing+' years playing handball':null].filter(Boolean).join(' • ');$('bio').textContent=p.bio||'No bio added yet.';$('accomplishments').textContent=p.accomplishments||'No accomplishments added yet.';$('tournaments').textContent=p.tournaments_played||'No tournaments added yet.';$('history').textContent=p.player_history||'No player history added yet.';$('gallery').innerHTML=(g||[]).length?(g||[]).map(x=>'<img src="'+esc(x.image_url)+'" title="'+esc(x.caption||'Handball memory')+'">').join(''):'<div class="muted">No gallery photos yet.</div>';$('loading').style.display='none';$('profile').style.display='block'}boot();</script></body></html>
