<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19c957"><title>Season Player Commitment Agreement · Dallas THC</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#090d0a;color:#f4f8f5;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:800px;margin:auto;padding:24px 16px 100px}h1{font-size:27px;line-height:1.25}h2{font-size:21px}.card{background:#131e16;border:1px solid #36513e;border-radius:14px;padding:20px;margin:18px 0}.legal{border-left:4px solid #19c957}.muted{color:#aebdb2}.btn,button,input{font:inherit;border-radius:9px;border:1px solid #47654f;background:#0e1811;color:#fff;padding:12px;min-height:44px}.btn{display:inline-flex;align-items:center;text-decoration:none;line-height:1.4;max-width:100%;margin:3px 0}button{cursor:pointer}.primary{background:#19c957;color:#061b0c;font-weight:800}button:disabled{opacity:.5}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.choice input{width:23px;height:23px;min-height:0;flex-shrink:0;accent-color:#19c957;margin-top:3px}.error{color:#ffbd9f}.receipt{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #78efa0;outline-offset:3px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}}@media print{.btn,#signatureForm,header{display:none}.card{border-color:#888}body{background:white;color:black}.muted{color:#333}.wrap{padding:0}}</style></head><body><main class="wrap"><a class="btn" href="./season-registration.html">← Season registration &amp; waiver</a><h1 id="title">Season Player Commitment Agreement</h1><p id="seasonLabel" class="muted"></p><p id="message" role="status">Loading agreement…</p><section class="card legal" aria-labelledby="agreementHeading"><h2 id="agreementHeading">Player commitment</h2><div id="terms"></div><p id="version" class="muted"></p></section><section id="signedCard" class="card" hidden><h2>Agreement signed</h2><p id="receipt" class="receipt"></p><p class="muted">This is your saved signature record. Your waiver is kept separately.</p><a class="btn primary" href="./season-registration.html">Continue to season registration</a></section><form id="signatureForm" hidden><section class="card"><h2>Sign for this season</h2><p id="participant" class="muted"></p><div class="field"><label for="dob">Participant’s date of birth</label><input id="dob" type="date" required></div><p id="signerHelp" class="muted"></p><div class="field"><label for="signer">Electronic signature — signer’s full legal name</label><input id="signer" required minlength="3" maxlength="300" autocomplete="off"></div><div id="guardianFields" class="grid" hidden><div class="field"><label for="guardianEmail">Parent or guardian email</label><input id="guardianEmail" type="email" maxlength="300"></div><div class="field"><label for="guardianPhone">Parent or guardian phone</label><input id="guardianPhone" type="tel" minlength="7" maxlength="100"></div></div><label class="choice"><input id="accept" type="checkbox" required><span>I have read and agree to this season’s Player Commitment Agreement.</span></label><label class="choice"><input id="intent" type="checkbox" required><span>I am the adult participant, or the parent/legal guardian signing for a participant under 18. I intend my typed full name to be my electronic signature for the agreement and season shown above.</span></label><button class="primary" id="sign" type="submit">Sign season player agreement</button><p id="saveMessage" class="error" role="status"></p></section></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1" integrity="sha384-q36VSR1ktH2hgqgm+0LDeyqPW8CyZHSxfDSttSPm5ReOJzB+sYThmh7D4fE+jWTs" crossorigin="anonymous"></script><script src="./season-player-agreement.js?v=20261017-1"></script><script defer src="./header.js"></script></body></html>
