<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Player Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand span{color:#19c957}.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;cursor:pointer;text-decoration:none}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.muted{color:#999;font-size:12px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px}.hero{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}.hero img{width:110px;height:110px;border-radius:14px;object-fit:cover;background:#222}.hero h1{margin:0 0 6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{margin-top:18px}.section h2{font-size:18px}.feed{display:grid;gap:10px}.announcement{border-left:3px solid #19c957}.practice-date{font-size:28px;font-weight:900}.player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player-card{display:block;background:#151515;border:1px solid #292929;border-radius:13px;overflow:hidden;color:#fff;text-decoration:none}.player-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}.player-info{padding:10px}.player-name{font-weight:800}.chip{display:inline-block;margin-top:5px;margin-right:5px;padding:4px 7px;border-radius:999px;background:#102718;border:1px solid #285d38;color:#9cf4b8;font-size:11px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:18px;text-align:center;color:#777;border:1px dashed #333;border-radius:12px}.jersey-alert{margin-bottom:14px}.pending{border-left:4px solid #ffcc66}.denied{border-left:4px solid #ff6b6b}.verified{border-left:4px solid #19c957}.jersey-num{font-size:30px;font-weight:950;margin:3px 0}.alert-actions{margin-top:10px}@media(max-width:800px){.player-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:520px){.hero{grid-template-columns:82px 1fr}.hero img{width:82px;height:82px}.hero h1{font-size:22px}.top-actions .btn{padding:9px 10px}}</style></head><body><header><div class="bar"><div class="brand"><img src="./Dallas-thc-logo.png.JPG" class="logo" alt="Dallas THC"><div>Dallas <span>THC</span><div class="muted">PLAYER DASHBOARD</div></div></div><div class="top-actions"><a class="btn primary" href="./club-hub.html">Club Hub</a><a class="btn" href="./profile-completion.html">Complete Profile</a><a class="btn" href="./events.html">Events</a><a class="btn" href="./player.html">My Profile</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading dashboard…</div><div id="app" style="display:none"><div id="jerseyAlert"></div><a id="myProfileLink" href="./player.html" class="card hero" style="color:inherit;text-decoration:none"><img id="myPhoto" src="./Dallas-thc-logo.png.JPG" alt="My profile"><div><div class="muted">WELCOME BACK</div><h1 id="welcomeName"></h1><div id="myMeta" class="muted"></div><div style="margin-top:10px;color:#19c957;font-weight:800">Tap your photo or card to open your profile →</div></div></a><div class="grid2 section"><section><h2>Club Announcements</h2><div id="announcements" class="feed"></div></section><section><h2>Upcoming Practices</h2><div id="practices" class="feed"></div></section></div><section class="section"><h2>Player Directory</h2><div class="muted" style="margin-bottom:10px">Tap any player to view their handball profile.</div><div id="players" class="player-grid"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const uid=session.user.id;const {data:me}=await sb.from('player_directory_public').select('id,user_id,name,team,position,jersey_number,profile_photo_url').eq('user_id',uid).maybeSingle();if(!me){location.href='./player.html';return}const [{data:anns},{data:pracs},{data:roster},{data:claims}]=await Promise.all([sb.from('club_announcements').select('*').in('audience',['All',me.team]).order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(10),sb.from('practices').select('*').in('team',['All',me.team]).gte('practice_date',new Date().toISOString().slice(0,10)).order('practice_date').order('start_time').limit(10),sb.from('player_directory_public').select('*').eq('status','Active').order('name'),sb.from('jersey_claims').select('*').eq('player_id',me.id).order('updated_at',{ascending:false}).limit(1)]);const claim=claims?.[0];renderJerseyAlert(me,claim);$('myPhoto').src=me.profile_photo_url||'./Dallas-thc-logo.png.JPG';$('welcomeName').textContent=me.name;$('myMeta').textContent=[me.team+' Team',me.position||'Position not added',me.jersey_number?'#'+me.jersey_number:(claim?.status==='Pending Verification'&&claim.claimed_jersey_number?'#'+claim.claimed_jersey_number+' • Pending approval':'Unassigned')].join(' • ');$('announcements').innerHTML=(anns||[]).length?(anns||[]).map(a=>'<div class="card announcement"><b>'+esc(a.title)+'</b><div class="muted" style="margin-top:4px">'+new Date(a.created_at).toLocaleDateString()+(a.pinned?' • Pinned':'')+'</div><div style="margin-top:8px;white-space:pre-wrap">'+esc(a.body)+'</div></div>').join(''):'<div class="empty">No announcements right now.</div>';$('practices').innerHTML=(pracs||[]).length?(pracs||[]).map(p=>'<div class="card"><div class="practice-date">'+new Date(p.practice_date+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</div><b>'+esc(p.title)+'</b><div class="muted" style="margin-top:5px">'+esc(p.team)+' • '+(p.start_time?esc(p.start_time.slice(0,5)):'Time TBA')+(p.location?' • '+esc(p.location):'')+'</div>'+(p.notes?'<div style="margin-top:8px">'+esc(p.notes)+'</div>':'')+'</div>').join(''):'<div class="empty">No upcoming practices posted.</div>';$('players').innerHTML=(roster||[]).map(p=>{const own=p.user_id===uid;const href=own?'./player.html':'./player-view.html?uid='+encodeURIComponent(p.user_id)+'&id='+encodeURIComponent(p.id);return '<a class="player-card" href="'+href+'"><img src="'+esc(p.profile_photo_url||'./Dallas-thc-logo.png.JPG')+'" alt="'+esc(p.name)+'"><div class="player-info"><div class="player-name">'+esc(p.name)+(own?' (You)':'')+'</div><span class="chip">'+esc(p.team)+'</span><span class="chip">'+esc(p.position||'Player')+'</span><span class="chip">'+(p.jersey_number?'#'+p.jersey_number:'Unassigned')+'</span></div></a>'}).join('');$('loading').style.display='none';$('app').style.display='block'}function renderJerseyAlert(me,c){if(!c){$('jerseyAlert').innerHTML='';return}if(c.status==='Rejected'){$('jerseyAlert').innerHTML='<div class="card jersey-alert denied"><b>Jersey number needs your attention</b><div class="jersey-num">#'+esc(c.claimed_jersey_number)+'</div><div>Your previous jersey number request was denied. Choose another number from the currently available numbers for the '+esc(me.team)+' team.</div>'+(c.admin_note?'<div class="muted" style="margin-top:6px">Admin note: '+esc(c.admin_note)+'</div>':'')+'<div class="alert-actions"><a class="btn primary" href="./jersey-selection.html">Choose Another Number</a></div></div>';return}if(c.status==='Pending Verification'&&c.claimed_jersey_number){$('jerseyAlert').innerHTML='<div class="card jersey-alert pending"><b>'+(c.conflict_detected?'Jersey number pending approval':'Jersey verification pending')+'</b><div class="jersey-num">#'+esc(c.claimed_jersey_number)+'</div><div class="muted">'+(c.conflict_detected?'That number is already assigned, so your account was created and the jersey request was sent to a Dallas THC admin for review.':'Your jersey number is waiting for club verification.')+'</div></div>';return}if(c.status==='Verified'&&me.jersey_number){$('jerseyAlert').innerHTML='<div class="card jersey-alert verified"><b>Jersey verified ✓</b><div class="muted" style="margin-top:4px">Your official Dallas THC number is #'+esc(me.jersey_number)+'.</div></div>';return}$('jerseyAlert').innerHTML=''}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();</script></body></html>
