<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Content Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.brand span{color:#19c957}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.danger{border-color:#693333;color:#ffaaaa}.muted{color:#999;font-size:12px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}.tab.active{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.panel{display:none}.panel.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.field textarea{min-height:100px;resize:vertical}.list{display:grid;gap:10px;margin-top:14px}.item{background:#151515;border:1px solid #292929;border-radius:12px;padding:13px}.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#102718;border:1px solid #285d38;color:#9cf4b8;font-size:11px;margin:4px 5px 0 0}.empty{padding:18px;text-align:center;border:1px dashed #333;border-radius:12px;color:#777}.top-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.grid2{grid-template-columns:1fr}.bar{align-items:flex-start}.top-actions .btn{padding:8px 10px;font-size:12px}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">ADMIN • CONTENT MANAGER</div></div><div class="top-actions"><a class="btn" href="./events.html">Events</a><a class="btn primary" href="./index.html">← Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading admin tools…</div><div id="app" style="display:none"><div class="tabs"><button class="btn tab active" data-tab="announcements">Announcements</button><button class="btn tab" data-tab="practices">Practices</button></div><section id="announcements" class="panel active"><div class="grid2"><div class="card"><h2 id="annTitle">Create Announcement</h2><div class="field"><label>Title</label><input id="aTitle"></div><div class="field" style="margin-top:10px"><label>Message</label><textarea id="aBody"></textarea></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Audience</label><select id="aAudience"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Pinned</label><select id="aPinned"><option value="false">No</option><option value="true">Yes</option></select></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveAnnouncement">Save Announcement</button><button class="btn" id="cancelAnnouncement" style="display:none">Cancel Edit</button></div><div id="aMsg" class="muted"></div></div><div><h2>Announcement Board</h2><div class="muted">Players see these on their dashboard.</div><div id="announcementList" class="list"></div></div></div></section><section id="practices" class="panel"><div class="grid2"><div class="card"><h2 id="practiceTitle">Create Practice</h2><div class="field"><label>Practice Name</label><input id="pTitle" value="Team Practice"></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Date</label><input id="pDate" type="date"></div><div class="field"><label>Team</label><select id="pTeam"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Start Time</label><input id="pStart" type="time"></div><div class="field"><label>End Time</label><input id="pEnd" type="time"></div></div><div class="field" style="margin-top:10px"><label>Location</label><input id="pLocation"></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="pNotes"></textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="savePractice">Save Practice</button><button class="btn" id="cancelPractice" style="display:none">Cancel Edit</button></div><div id="pMsg" class="muted"></div></div><div><h2>Practice Schedule</h2><div class="muted">Upcoming practices shown to players.</div><div id="practiceList" class="list"></div></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null,editingAnnouncement=null,editingPractice=null;function selectContentTab(){const tab=location.hash==='#practices'?'practices':'announcements';document.querySelectorAll('.tab').forEach(button=>{const active=button.dataset.tab===tab;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id===tab))}document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{location.hash='#'+button.dataset.tab;selectContentTab()});window.addEventListener('hashchange',selectContentTab);selectContentTab();function showAccessIssue(code,message){$('app').style.display='none';$('loading').style.display='block';$('loading').innerHTML='<h2>Unable to open this page</h2><p>'+esc(message)+'</p><p class="muted">Check: '+esc(code)+' · Build nav-check-3</p><a class="btn" href="./index.html">Back to sign in / dashboard</a> <button class="btn" type="button" onclick="location.reload()">Try again</button>'}async function boot(){const authResult=await sb.auth.getSession();session=authResult.data?.session;if(authResult.error){showAccessIssue('SESSION_ERROR','Your sign-in session could not be checked.');return}if(!session){showAccessIssue('NO_SESSION','This page cannot find your signed-in session. Return to sign in, then open this page again in the same Safari tab.');return}const {data:prof,error:profileError}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(profileError){showAccessIssue('PROFILE_ERROR','Your account permissions could not be checked. Please try again.');return}if(!prof){showAccessIssue('PROFILE_MISSING','Your account profile could not be found. Please contact a club administrator.');return}if(!['admin','manager'].includes(prof.role)){showAccessIssue('ADMIN_REQUIRED','This account does not have admin or manager access.');return}await Promise.all([loadAnnouncements(),loadPractices()]);$('loading').style.display='none';$('app').style.display='block'}async function loadAnnouncements(){const {data,error}=await sb.from('club_announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false});if(error){$('announcementList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('announcementList').innerHTML=(data||[]).length?(data||[]).map(a=>'<div class="item"><div class="itemhead"><div><b>'+esc(a.title)+'</b><div><span class="chip">'+esc(a.audience||'All')+'</span>'+(a.pinned?'<span class="chip">Pinned</span>':'')+'</div></div><div class="actions"><button class="btn" onclick="editAnnouncement(\''+a.id+'\')">Edit</button><button class="btn danger" onclick="deleteAnnouncement(\''+a.id+'\')">Delete</button></div></div><div style="margin-top:8px;white-space:pre-wrap">'+esc(a.body||'')+'</div></div>').join(''):'<div class="empty">No announcements yet.</div>'}async function editAnnouncement(id){const {data:a,error}=await sb.from('club_announcements').select('*').eq('id',id).single();if(error)return alert(error.message);editingAnnouncement=id;$('annTitle').textContent='Edit Announcement';$('aTitle').value=a.title||'';$('aBody').value=a.body||'';$('aAudience').value=a.audience||'All';$('aPinned').value=String(!!a.pinned);$('cancelAnnouncement').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}$('cancelAnnouncement').onclick=()=>{editingAnnouncement=null;$('annTitle').textContent='Create Announcement';$('aTitle').value='';$('aBody').value='';$('aAudience').value='All';$('aPinned').value='false';$('cancelAnnouncement').style.display='none'};$('saveAnnouncement').onclick=async()=>{const title=$('aTitle').value.trim(),body=$('aBody').value.trim();if(!title||!body){$('aMsg').textContent='Title and message are required.';return}const payload={title,body,audience:$('aAudience').value,pinned:$('aPinned').value==='true'};let r=editingAnnouncement?await sb.from('club_announcements').update(payload).eq('id',editingAnnouncement):await sb.from('club_announcements').insert({...payload,created_by:session.user.id});$('aMsg').textContent=r.error?.message||(editingAnnouncement?'Announcement updated.':'Announcement posted.');if(!r.error){$('cancelAnnouncement').click();loadAnnouncements()}};async function deleteAnnouncement(id){if(!confirm('Delete this announcement?'))return;const {error}=await sb.from('club_announcements').delete().eq('id',id);if(error)alert(error.message);else loadAnnouncements()}async function loadPractices(){const {data,error}=await sb.from('practices').select('*').order('practice_date',{ascending:true}).order('start_time',{ascending:true});if(error){$('practiceList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('practiceList').innerHTML=(data||[]).length?(data||[]).map(p=>'<div class="item"><div class="itemhead"><div><b>'+esc(p.title)+'</b><div><span class="chip">'+esc(p.team||'All')+'</span><span class="chip">'+esc(p.practice_date||'')+'</span></div></div><div class="actions"><button class="btn" onclick="editPractice(\''+p.id+'\')">Edit</button><button class="btn danger" onclick="deletePractice(\''+p.id+'\')">Delete</button></div></div><div class="muted" style="margin-top:8px">'+(p.start_time?esc(p.start_time.slice(0,5)):'Time TBA')+(p.end_time?'–'+esc(p.end_time.slice(0,5)):'')+(p.location?' • '+esc(p.location):'')+'</div>'+(p.notes?'<div style="margin-top:8px">'+esc(p.notes)+'</div>':'')+'</div>').join(''):'<div class="empty">No practices scheduled.</div>'}async function editPractice(id){const {data:p,error}=await sb.from('practices').select('*').eq('id',id).single();if(error)return alert(error.message);editingPractice=id;$('practiceTitle').textContent='Edit Practice';$('pTitle').value=p.title||'';$('pDate').value=p.practice_date||'';$('pTeam').value=p.team||'All';$('pStart').value=p.start_time?.slice(0,5)||'';$('pEnd').value=p.end_time?.slice(0,5)||'';$('pLocation').value=p.location||'';$('pNotes').value=p.notes||'';$('cancelPractice').style.display='inline-block';document.querySelector('[data-tab="practices"]').scrollIntoView({behavior:'smooth'})}$('cancelPractice').onclick=()=>{editingPractice=null;$('practiceTitle').textContent='Create Practice';$('pTitle').value='Team Practice';$('pDate').value='';$('pTeam').value='All';$('pStart').value='';$('pEnd').value='';$('pLocation').value='';$('pNotes').value='';$('cancelPractice').style.display='none'};$('savePractice').onclick=async()=>{const title=$('pTitle').value.trim(),date=$('pDate').value;if(!title||!date){$('pMsg').textContent='Practice name and date are required.';return}const payload={title,practice_date:date,start_time:$('pStart').value||null,end_time:$('pEnd').value||null,location:$('pLocation').value.trim()||null,team:$('pTeam').value,notes:$('pNotes').value.trim()||null};let r=editingPractice?await sb.from('practices').update(payload).eq('id',editingPractice):await sb.from('practices').insert({...payload,created_by:session.user.id});$('pMsg').textContent=r.error?.message||(editingPractice?'Practice updated.':'Practice created.');if(!r.error){$('cancelPractice').click();loadPractices()}};async function deletePractice(id){if(!confirm('Delete this practice?'))return;const {error}=await sb.from('practices').delete().eq('id',id);if(error)alert(error.message);else loadPractices()}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./index.html'};boot().catch(()=>showAccessIssue('LOAD_ERROR','The page could not finish loading. Please try again.'));</script></body></html>
