<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19c957"><title>Dallas THC Content Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.brand span{color:#19c957}.wrap{max-width:1100px;margin:auto;padding:18px 14px 70px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.danger{border-color:#693333;color:#ffaaaa}.muted{color:#999;font-size:12px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}.tab.active{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.panel{display:none}.panel.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:15px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:8px}.field textarea{min-height:100px;resize:vertical}.list{display:grid;gap:10px;margin-top:14px}.item{background:#151515;border:1px solid #292929;border-radius:12px;padding:13px}.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#102718;border:1px solid #285d38;color:#9cf4b8;font-size:11px;margin:4px 5px 0 0}.empty{padding:18px;text-align:center;border:1px dashed #333;border-radius:12px;color:#777}.top-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.grid2{grid-template-columns:1fr}.bar{align-items:flex-start}.top-actions .btn{padding:8px 10px;font-size:12px}}</style></head><body><header><div class="bar"><div class="brand">Dallas <span>THC</span><div class="muted">ADMIN • CONTENT MANAGER</div></div><div class="top-actions"><a class="btn" href="./events.html">Events</a><a class="btn primary" href="./index.html">← Dashboard</a><button class="btn" id="logout">Log out</button></div></div></header><main class="wrap"><div id="loading" class="card">Loading admin tools…</div><div id="app" style="display:none"><div class="tabs"><button class="btn tab active" data-tab="announcements">Announcements</button><button class="btn tab" data-tab="practices">Practices</button></div><section id="announcements" class="panel active"><div class="grid2"><div class="card"><h2 id="annTitle">Create Announcement</h2><div class="field"><label>Title</label><input id="aTitle"></div><div class="field" style="margin-top:10px"><label>Message</label><textarea id="aBody"></textarea></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Audience</label><select id="aAudience"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Pinned</label><select id="aPinned"><option value="false">No</option><option value="true">Yes</option></select></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveAnnouncement">Save Announcement</button><button class="btn" id="cancelAnnouncement" style="display:none">Cancel Edit</button></div><div id="aMsg" class="muted"></div></div><div><h2>Announcement Board</h2><div class="muted">Players see these on their dashboard.</div><div id="announcementList" class="list"></div></div></div></section><section id="practices" class="panel"><div class="grid2"><div class="card"><h2 id="practiceTitle">Create Practice</h2><div class="field"><label>Practice Name</label><input id="pTitle" value="Team Practice"></div><div class="grid2" style="margin-top:10px"><div class="field"><label>First Practice Date</label><input id="pDate" type="date"></div><div class="field"><label>Team</label><select id="pTeam"><option>All</option><option>Men</option><option>Women</option></select></div><div class="field"><label>Start Time</label><input id="pStart" type="time" value="18:00"></div><div class="field"><label>End Time</label><input id="pEnd" type="time"></div></div><div class="grid2" style="margin-top:10px"><div class="field"><label>Repeats</label><select id="pRepeat"><option value="once">One time</option><option value="weekly">Every week</option></select></div><div class="field" id="repeatUntilField" style="display:none"><label>Repeat Until</label><input id="pRepeatUntil" type="date"></div></div><div id="repeatHint" class="muted" style="margin-top:6px"></div><div class="field" style="margin-top:10px"><label>Location / Venue</label><input id="pLocation" placeholder="Gym or facility name"></div><div class="field" style="margin-top:10px"><label>Street Address</label><input id="pAddress" placeholder="Full practice address"></div><div class="field" style="margin-top:10px"><label>Practice Information</label><textarea id="pNotes" placeholder="Parking, court, entrance instructions, what to bring, etc."></textarea></div><div class="field" id="editScopeField" style="margin-top:10px;display:none"><label>Apply Edits To</label><select id="pEditScope"><option value="one">This practice only</option><option value="future">This and future practices in this series</option></select></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="savePractice">Save Practice</button><button class="btn" id="cancelPractice" style="display:none">Cancel Edit</button></div><div id="pMsg" class="muted"></div></div><div><h2>Practice Schedule</h2><div class="muted">Weekly practices can be canceled individually without removing the rest of the series.</div><div id="practiceList" class="list"></div></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1" integrity="sha384-q36VSR1ktH2hgqgm+0LDeyqPW8CyZHSxfDSttSPm5ReOJzB+sYThmh7D4fE+jWTs" crossorigin="anonymous"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let session=null,editingAnnouncement=null,editingPractice=null,editingPracticeData=null;function selectContentTab(){const tab=location.hash==='#practices'?'practices':'announcements';document.querySelectorAll('.tab').forEach(button=>{const active=button.dataset.tab===tab;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id===tab))}document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{location.hash='#'+button.dataset.tab;selectContentTab()});window.addEventListener('hashchange',selectContentTab);selectContentTab();function showAccessIssue(code,message){$('app').style.display='none';$('loading').style.display='block';$('loading').innerHTML='<h2>Unable to open this page</h2><p>'+esc(message)+'</p><p class="muted">Check: '+esc(code)+' · Build nav-check-3</p><a class="btn" href="./index.html">Back to sign in / dashboard</a> <button class="btn" type="button" onclick="location.reload()">Try again</button>'}async function boot(){const authResult=await sb.auth.getSession();session=authResult.data?.session;if(authResult.error){showAccessIssue('SESSION_ERROR','Your sign-in session could not be checked.');return}if(!session){showAccessIssue('NO_SESSION','This page cannot find your signed-in session. Return to sign in, then open this page again in the same Safari tab.');return}const {data:prof,error:profileError}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(profileError){showAccessIssue('PROFILE_ERROR','Your account permissions could not be checked. Please try again.');return}if(!prof){showAccessIssue('PROFILE_MISSING','Your account profile could not be found. Please contact a club administrator.');return}if(!['admin','manager'].includes(prof.role)){showAccessIssue('ADMIN_REQUIRED','This account does not have admin or manager access.');return}await Promise.all([loadAnnouncements(),loadPractices()]);$('loading').style.display='none';$('app').style.display='block'}async function loadAnnouncements(){const {data,error}=await sb.from('club_announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false});if(error){$('announcementList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('announcementList').innerHTML=(data||[]).length?(data||[]).map(a=>'<div class="item"><div class="itemhead"><div><b>'+esc(a.title)+'</b><div><span class="chip">'+esc(a.audience||'All')+'</span>'+(a.pinned?'<span class="chip">Pinned</span>':'')+'</div></div><div class="actions"><button class="btn" onclick="editAnnouncement(\''+a.id+'\')">Edit</button><button class="btn danger" onclick="deleteAnnouncement(\''+a.id+'\')">Delete</button></div></div><div style="margin-top:8px;white-space:pre-wrap">'+esc(a.body||'')+'</div></div>').join(''):'<div class="empty">No announcements yet.</div>'}async function editAnnouncement(id){const {data:a,error}=await sb.from('club_announcements').select('*').eq('id',id).single();if(error)return alert(error.message);editingAnnouncement=id;$('annTitle').textContent='Edit Announcement';$('aTitle').value=a.title||'';$('aBody').value=a.body||'';$('aAudience').value=a.audience||'All';$('aPinned').value=String(!!a.pinned);$('cancelAnnouncement').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}$('cancelAnnouncement').onclick=()=>{editingAnnouncement=null;$('annTitle').textContent='Create Announcement';$('aTitle').value='';$('aBody').value='';$('aAudience').value='All';$('aPinned').value='false';$('cancelAnnouncement').style.display='none'};$('saveAnnouncement').onclick=async()=>{const title=$('aTitle').value.trim(),body=$('aBody').value.trim();if(!title||!body){$('aMsg').textContent='Title and message are required.';return}const payload={title,body,audience:$('aAudience').value,pinned:$('aPinned').value==='true'};let r=editingAnnouncement?await sb.from('club_announcements').update(payload).eq('id',editingAnnouncement):await sb.from('club_announcements').insert({...payload,created_by:session.user.id});$('aMsg').textContent=r.error?.message||(editingAnnouncement?'Announcement updated.':'Announcement posted.');if(!r.error){$('cancelAnnouncement').click();loadAnnouncements()}};async function deleteAnnouncement(id){if(!confirm('Delete this announcement?'))return;const {error}=await sb.from('club_announcements').delete().eq('id',id);if(error)alert(error.message);else loadAnnouncements()}function nextMondayISO(){const d=new Date();d.setHours(12,0,0,0);const add=(8-d.getDay())%7||7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10)}function plusWeeksISO(date,weeks){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+weeks*7);return d.toISOString().slice(0,10)}function weekdayName(date){return date?new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long'}):'week'}function updateRepeatUI(){const weekly=$('pRepeat').value==='weekly';$('repeatUntilField').style.display=weekly?'block':'none';$('repeatHint').textContent=weekly&&$('pDate').value?'Repeats every '+weekdayName($('pDate').value)+' at '+($('pStart').value||'the selected time')+'. You can cancel individual dates later.':'';if(weekly&&$('pDate').value&&!$('pRepeatUntil').value)$('pRepeatUntil').value=plusWeeksISO($('pDate').value,26)}$('pRepeat').onchange=updateRepeatUI;$('pDate').onchange=updateRepeatUI;$('pStart').onchange=updateRepeatUI;async function loadPractices(){const {data,error}=await sb.from('practices').select('*').order('practice_date',{ascending:true}).order('start_time',{ascending:true});if(error){$('practiceList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}$('practiceList').innerHTML=(data||[]).length?(data||[]).map(p=>'<div class="item" style="'+(p.canceled?'opacity:.7;border-color:#6a3434':'')+'"><div class="itemhead"><div><b>'+esc(p.title)+'</b><div><span class="chip">'+esc(p.team||'All')+'</span><span class="chip">'+esc(p.practice_date||'')+'</span>'+(p.series_id?'<span class="chip">Weekly</span>':'')+(p.canceled?'<span class="chip" style="border-color:#7b3c3c;color:#ffb0b0">Canceled</span>':'')+'</div></div><div class="actions"><button class="btn" onclick="editPractice(\''+p.id+'\')">Edit</button><button class="btn '+(p.canceled?'':'danger')+'" onclick="togglePracticeCanceled(\''+p.id+'\','+(!p.canceled)+')">'+(p.canceled?'Restore':'Cancel')+'</button><button class="btn danger" onclick="deletePractice(\''+p.id+'\')">Delete</button></div></div><div class="muted" style="margin-top:8px">'+(p.start_time?esc(p.start_time.slice(0,5)):'Time TBA')+(p.end_time?'–'+esc(p.end_time.slice(0,5)):'')+(p.location?' • '+esc(p.location):'')+(p.address?' • '+esc(p.address):'')+'</div>'+(p.notes?'<div style="margin-top:8px">'+esc(p.notes)+'</div>':'')+(p.canceled&&p.cancel_reason?'<div style="margin-top:8px;color:#ffaaaa">Canceled: '+esc(p.cancel_reason)+'</div>':'')+'</div>').join(''):'<div class="empty">No practices scheduled.</div>'}async function editPractice(id){const {data:p,error}=await sb.from('practices').select('*').eq('id',id).single();if(error)return alert(error.message);editingPractice=id;editingPracticeData=p;$('practiceTitle').textContent='Edit Practice';$('pTitle').value=p.title||'';$('pDate').value=p.practice_date||'';$('pTeam').value=p.team||'All';$('pStart').value=p.start_time?.slice(0,5)||'';$('pEnd').value=p.end_time?.slice(0,5)||'';$('pLocation').value=p.location||'';$('pAddress').value=p.address||'';$('pNotes').value=p.notes||'';$('pRepeat').value=p.series_id?'weekly':'once';$('pRepeat').disabled=!!p.series_id;$('repeatUntilField').style.display='none';$('editScopeField').style.display=p.series_id?'block':'none';$('cancelPractice').style.display='inline-block';$('repeatHint').textContent=p.series_id?'This practice belongs to a weekly series. Choose whether edits affect only this date or this and future dates.':'';document.querySelector('[data-tab="practices"]').scrollIntoView({behavior:'smooth'})}function resetPracticeForm(){editingPractice=null;editingPracticeData=null;$('practiceTitle').textContent='Create Practice';$('pTitle').value='Team Practice';$('pDate').value=nextMondayISO();$('pTeam').value='All';$('pStart').value='18:00';$('pEnd').value='';$('pLocation').value='';$('pAddress').value='';$('pNotes').value='';$('pRepeat').disabled=false;$('pRepeat').value='weekly';$('pRepeatUntil').value=plusWeeksISO($('pDate').value,26);$('editScopeField').style.display='none';$('cancelPractice').style.display='none';updateRepeatUI()}$('cancelPractice').onclick=resetPracticeForm;$('savePractice').onclick=async()=>{const title=$('pTitle').value.trim(),date=$('pDate').value;if(!title||!date){$('pMsg').textContent='Practice name and date are required.';return}const base={title,practice_date:date,start_time:$('pStart').value||null,end_time:$('pEnd').value||null,location:$('pLocation').value.trim()||null,address:$('pAddress').value.trim()||null,team:$('pTeam').value,notes:$('pNotes').value.trim()||null};let error=null,message='';if(editingPractice){if(editingPracticeData?.series_id&&$('pEditScope').value==='future'){const updates={title:base.title,start_time:base.start_time,end_time:base.end_time,location:base.location,address:base.address,team:base.team,notes:base.notes,updated_at:new Date().toISOString()};const result=await sb.from('practices').update(updates).eq('series_id',editingPracticeData.series_id).gte('practice_date',editingPracticeData.practice_date);error=result.error;message='This and future practices updated.'}else{const result=await sb.from('practices').update({...base,updated_at:new Date().toISOString()}).eq('id',editingPractice);error=result.error;message='Practice updated.'}}else if($('pRepeat').value==='weekly'){const until=$('pRepeatUntil').value;if(!until||until<date){$('pMsg').textContent='Choose a valid repeat-until date.';return}const dates=[];for(let d=date,i=0;d<=until&&i<53;i++,d=plusWeeksISO(date,i+1))dates.push(d);if(dates.length>=53&&plusWeeksISO(date,53)<=until){$('pMsg').textContent='Please keep a recurring series to 53 weeks or less.';return}const series_id=crypto.randomUUID();const rows=dates.map(practice_date=>({...base,practice_date,series_id,created_by:session.user.id}));const result=await sb.from('practices').insert(rows);error=result.error;message=dates.length+' weekly practices created.'}else{const result=await sb.from('practices').insert({...base,created_by:session.user.id});error=result.error;message='Practice created.'}$('pMsg').textContent=error?.message||message;if(!error){resetPracticeForm();loadPractices()}};async function togglePracticeCanceled(id,canceled){let reason=null;if(canceled){reason=prompt('Optional cancellation reason:')||null;if(!confirm('Cancel this practice date? The rest of the recurring series will stay scheduled.'))return}const {error}=await sb.from('practices').update({canceled,cancel_reason:canceled?reason:null,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadPractices()}async function deletePractice(id){if(!confirm('Permanently delete this practice? For a recurring series, Cancel is usually better.'))return;const {error}=await sb.from('practices').delete().eq('id',id);if(error)alert(error.message);else loadPractices()}resetPracticeForm();$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./index.html'};boot().catch(()=>showAccessIssue('LOAD_ERROR','The page could not finish loading. Please try again.'));</script><script defer src="./header.js"></script></body></html>
