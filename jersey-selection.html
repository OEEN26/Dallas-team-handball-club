<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19c957"><title>Dallas THC Jersey Selection</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 14px 70px}.card{background:#151515;border:1px solid #292929;border-radius:15px;padding:18px}.btn{border:1px solid #303030;background:#171717;color:#eee;padding:10px 12px;border-radius:9px;text-decoration:none;cursor:pointer}.primary{background:#19c957;color:#061108;border-color:#19c957;font-weight:800}.muted{color:#999;font-size:12px}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:5px}.field select{width:100%;padding:12px;background:#0e0e0e;color:#fff;border:1px solid #303030;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.warn{border-left:3px solid #ffcc66}.big{font-size:38px;font-weight:950;color:#19c957;margin:8px 0}</style></head><body><main class="wrap"><a class="btn" href="./player-dashboard.html">← Player Dashboard</a><div id="loading" class="card" style="margin-top:14px">Loading your jersey request…</div><div id="app" style="display:none"><div class="card warn" style="margin-top:14px"><h2 style="margin-top:0">Choose Another Jersey Number</h2><p>Your previous jersey request was denied. Select a new number from the list below. Only numbers that are currently unassigned on your team are shown.</p><div class="muted">Previous request</div><div id="oldNumber" class="big"></div><div id="adminNote" class="muted"></div><div class="field" style="margin-top:18px"><label>Available Jersey Numbers</label><select id="number"></select></div><div class="actions"><button id="submit" class="btn primary">Submit New Number</button><a class="btn" href="./player-dashboard.html">Cancel</a></div><div id="msg" class="muted" style="margin-top:10px"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1" integrity="sha384-q36VSR1ktH2hgqgm+0LDeyqPW8CyZHSxfDSttSPm5ReOJzB+sYThmh7D4fE+jWTs" crossorigin="anonymous"></script><script>const sb=supabase.createClient('https://edfshtjrxbtydoaghhip.supabase.co','sb_publishable_O0ozz6dTfqcSjmnzl5uwHQ_oc_-EXeZ'),$=x=>document.getElementById(x);let player,claim;async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';const {data:p,error}=await sb.from('players').select('id,team,name').eq('user_id',session.user.id).is('deleted_at',null).maybeSingle();if(error||!p){$('loading').textContent=error?.message||'Player profile not found.';return}player=p;const {data:c,error:ce}=await sb.from('jersey_claims').select('*').eq('player_id',p.id).eq('status','Rejected').order('updated_at',{ascending:false}).limit(1);if(ce){$('loading').textContent=ce.message;return}claim=c?.[0];if(!claim){$('loading').textContent='You do not have a denied jersey request.';return}const {data:nums,error:ne}=await sb.rpc('get_available_jersey_numbers',{p_team:p.team});if(ne){$('loading').textContent=ne.message;return}$('oldNumber').textContent='#'+claim.claimed_jersey_number;$('adminNote').textContent=claim.admin_note||'Please choose another available number.';$('number').innerHTML=(nums||[]).map(x=>'<option value="'+x.jersey_number+'">#'+x.jersey_number+'</option>').join('');$('loading').style.display='none';$('app').style.display='block'}$('submit').onclick=async()=>{const num=Number($('number').value);if(!num)return;$('msg').textContent='Submitting…';const {error}=await sb.rpc('player_resubmit_rejected_jersey_claim',{p_claim_id:claim.id,p_number:num});if(error){$('msg').textContent=error.message;return}$('msg').textContent='Submitted. Your jersey request is pending approval.';setTimeout(()=>location.href='./player-dashboard.html',900)};boot();</script><script defer src="./header.js"></script></body></html>
